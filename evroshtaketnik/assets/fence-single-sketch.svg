<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">Односторонний вертикальный металлический евроштакетник</title>
<desc id="d">Профессиональная схема узкого ребристого евроштакетника с полукруглым верхом в один ряд</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#faf9f5"/><stop offset="1" stop-color="#ece9e1"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d9dcde"/><stop offset=".18" stop-color="#f4f5f5"/><stop offset=".5" stop-color="#b8bdc0"/><stop offset=".78" stop-color="#f0f1f1"/><stop offset="1" stop-color="#9ca2a6"/></linearGradient>
  <linearGradient id="post" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#555d62"/><stop offset=".5" stop-color="#899095"/><stop offset="1" stop-color="#444b50"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1e2326" flood-opacity=".13"/></filter>
  <g id="picket">
    <path d="M0 18 A12 12 0 0 1 24 18 V330 H0 Z" fill="url(#metal)" stroke="#8f969a" stroke-width="1.2"/>
    <path d="M5 24V320M12 20V320M19 24V320" fill="none" stroke="#80878b" stroke-width=".9" opacity=".62"/>
  </g>
</defs>
<rect width="800" height="520" rx="26" fill="url(#bg)"/>
<ellipse cx="400" cy="444" rx="310" ry="16" fill="#777" opacity=".08"/>
<g transform="translate(65 48)" filter="url(#shadow)">
  <rect x="15" y="22" width="25" height="365" rx="3" fill="url(#post)" stroke="#474e53" stroke-width="1.5"/>
  <rect x="630" y="22" width="25" height="365" rx="3" fill="url(#post)" stroke="#474e53" stroke-width="1.5"/>
  <rect x="32" y="126" width="605" height="15" rx="2" fill="#8c9296" stroke="#6d7478"/>
  <rect x="32" y="287" width="605" height="15" rx="2" fill="#8c9296" stroke="#6d7478"/>
  <g>
    <use href="#picket" x="60" y="12"/><use href="#picket" x="90" y="12"/><use href="#picket" x="120" y="12"/>
    <use href="#picket" x="150" y="12"/><use href="#picket" x="180" y="12"/><use href="#picket" x="210" y="12"/>
    <use href="#picket" x="240" y="12"/><use href="#picket" x="270" y="12"/><use href="#picket" x="300" y="12"/>
    <use href="#picket" x="330" y="12"/><use href="#picket" x="360" y="12"/><use href="#picket" x="390" y="12"/>
    <use href="#picket" x="420" y="12"/><use href="#picket" x="450" y="12"/><use href="#picket" x="480" y="12"/>
    <use href="#picket" x="510" y="12"/><use href="#picket" x="540" y="12"/><use href="#picket" x="570" y="12"/>
  </g>
</g>
</svg>