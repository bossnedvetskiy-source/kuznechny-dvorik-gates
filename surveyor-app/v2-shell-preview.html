<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>КД Управление — прототип оболочки v2</title>
<style>
:root{color-scheme:dark;--bg:#111827;--card:#1f2937;--text:#f8fafc;--muted:#a5b4c7;--border:#374151;--accent:#93c5fd;--primary:#2563eb;--focus:#60a5fa}
:root[data-theme=light]{color-scheme:light;--bg:#f1f5f9;--card:#fff;--text:#172033;--muted:#526176;--border:#d3dce8;--accent:#1d4ed8;--primary:#1d4ed8;--focus:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.shell{max-width:1050px;margin:auto;min-height:100dvh;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}.brand{flex:1;min-width:0}.brand b{font-size:clamp(16px,4vw,23px);display:block}.muted,small{color:var(--muted)}small{font-size:12px}.icon-btn{border:1px solid var(--border);background:var(--card);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.notice{border:1px solid var(--border);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:13px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi,.panel,.tile{background:var(--card);border:1px solid var(--border);border-radius:14px}.kpi{padding:13px;min-width:0}.kpi strong{display:block;font-size:27px;margin-top:6px}.panel{padding:14px;margin-top:12px}.panel h2,.section-title{font-size:16px;margin:0 0 9px}.section-title{margin:20px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tiles.survey{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:12px 4px;min-height:90px;text-align:center;font-size:13px;font-weight:650;overflow-wrap:anywhere}
svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.tile svg{width:27px;height:27px}.icon-btn svg{width:22px;height:22px}
.action{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:14px;padding:16px;margin-bottom:10px;min-height:72px}.action b,.action small{display:block}.action.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.action.primary small{color:#dbeafe}.action.primary svg{stroke:#fff}.action .chevron{margin-left:auto}
.question{display:flex;align-items:center;justify-content:space-between;background:none;border:0;border-top:1px solid var(--border);width:100%;text-align:left;padding:12px 0;min-height:44px;font-size:14px}.question:first-of-type{border-top:0}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,1050px);display:flex;background:var(--card);border-top:1px solid var(--border);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:2}.bottom button{min-width:0;flex:1;background:none;border:0;display:grid;justify-items:center;gap:4px;color:var(--muted);font-size:11px;padding:4px 0;min-height:48px}.bottom button[aria-current=page]{color:var(--accent);font-weight:700}.bottom svg{width:22px;height:22px}.back{margin-bottom:12px}.detail h1{font-size:23px;margin:0 0 10px}.detail p{color:var(--muted)}.workspace{display:grid;gap:8px}.workspace button{padding:13px;background:var(--card);border:1px solid var(--border);border-radius:10px;text-align:left;min-height:44px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles.survey{grid-template-columns:repeat(3,minmax(0,1fr))}.tile{min-height:112px;font-size:15px}.shell{padding:24px 24px 100px}}
</style>
</head>
<body>
<div class="shell">
<header><button id="menu" class="icon-btn" aria-label="Рабочие пространства"></button><div class="brand"><b id="brand"></b><small id="subtitle"></small></div><button id="theme" class="icon-btn" aria-label="Переключить тему"></button><button id="alerts" class="icon-btn" aria-label="Уведомления"></button></header>
<div class="notice">Изолированный прототип интерфейса. Без авторизации, рабочих данных и связи с сервером. Переключение ролей здесь только для демонстрации.</div>
<main id="content"></main>
<nav id="nav" class="bottom" aria-label="Основная навигация"></nav>
</div>
<script type="module">
const paths={
menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>',moon:'<path d="M20 15A8 8 0 0 1 9 4 9 9 0 1 0 20 15Z"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 6-3 6-3 8h18c0-2-3-2-3-8M10 20h4"/>',home:'<path d="m3 10 9-7 9 7v10h-6v-6H9v6H3Z"/>',tasks:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="m7 9 2 2 3-4m2 3h3m-10 6 2 2 3-4m2 3h3"/>',clients:'<circle cx="9" cy="7" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 5v2"/>',orders:'<rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4V2h6v2M9 10h6m-6 4h6m-6 4h4"/>',factory:'<path d="M3 21V10l6 3V8l6 4V4h5l1 17ZM7 17h2m3 0h2m3 0h2"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18M8 15h2m4 0h2"/>',truck:'<path d="M2 5h12v12H2Zm12 5h5l3 4v3h-8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',stock:'<path d="m3 7 9-5 9 5v10l-9 5-9-5ZM3 7l9 5 9-5m-9 5v10M8 5l9 5"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 8V5l14-3m4 9h-6v5h6m-4-2h.1"/>',ads:'<path d="m3 9 14-5v16L3 15Zm4 7 2 5h3l-2-5m10-7v6"/>',star:'<path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/>',ruler:'<path d="m3 17 14-14 4 4L7 21Zm5-5 3 3m1-7 3 3m1-7 3 3"/>',chart:'<path d="M3 3v18h18M7 17v-5m5 5V8m5 9V5"/>',calc:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8m-8 5h1m6 0h1m-8 4h1m6 0h1m-8 4h1m6 0h1"/>',catalog:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="8" r="1"/>',file:'<path d="M5 2h10l4 4v16H5Zm10 0v5h4M8 12h8m-8 4h8"/>',check:'<path d="M5 2h10l4 4v16H5Zm10 0v5h4m-11 8 2 2 5-5"/>',arrow:'<path d="m9 18 6-6-6-6"/>',back:'<path d="m15 6-6 6 6 6"/>',history:'<path d="M3 12a9 9 0 1 1 3 7m-3-1v-6h6m3-5v5l3 2"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4 3l-1 2m0 3h.1"/>'};
const icon=(key)=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(paths[key]||paths.help)+'</svg>';
const owner=[['tasks','Задачи','Ежедневный план, поручения и просрочки.'],['clients','Клиенты','Обращения, переговоры и воронка.'],['orders','Заказы','Договоры, комплектация и сроки.'],['factory','Цех','Задания и загрузка производства.'],['calendar','Календарь','Замеры, контакты и сроки.'],['truck','Доставка','Готовность, выдача и доставка.'],['stock','Склад','Материалы и закупки.'],['wallet','Финансы','Оплаты, расходы и прибыль.'],['ads','Реклама','Источники клиентов и эффективность.'],['star','Отзывы','Качество и рекламации.'],['ruler','Замерщик','Быстрые расчёты и замеры.'],['chart','Аналитика','Показатели предприятия.']];
const survey=[['catalog','Каталог','Изделия и варианты комплектации.'],['calc','Мои расчёты','Сохранённые расчёты и черновики.'],['clients','Клиенты','Контакты и история обращений.'],['calendar','Календарь','Назначенные замеры и контакты.'],['file','Предложения','Коммерческие предложения.'],['check','Договоры','Согласованные договоры.']];
const questions=[['tasks','Что сделать сегодня?'],['wallet','Кто должен деньги?'],['orders','Какие заказы требуют внимания?']];
let role='owner',screen='home',theme='dark';
try{if(localStorage.getItem('kd-v2-preview-theme')==='light')theme='light'}catch{}
const el=id=>document.getElementById(id);
function button(key,label,cls='tile',extra=''){return '<button class="'+cls+'" data-go="'+key+'" type="button">'+icon(key)+'<span>'+label+'</span>'+extra+'</button>'}
function action(key,label,desc,primary=false){return '<button class="action'+(primary?' primary':'')+'" type="button" data-go="'+key+'">'+icon(key)+'<span><b>'+label+'</b><small>'+desc+'</small></span><span class="chevron">'+icon('arrow')+'</span></button>'}
function show(next){if(role==='surveyor'&&['wallet','factory','stock','ads','chart','star','truck','orders','tasks'].includes(next))return;if(next==='ruler'&&role==='owner'){role='surveyor';next='home'}screen=next;render();window.scrollTo(0,0)}
function render(){
document.documentElement.dataset.theme=theme;el('menu').innerHTML=icon('menu');el('theme').innerHTML=icon(theme==='dark'?'sun':'moon');el('alerts').innerHTML=icon('bell');
el('brand').textContent=role==='owner'?'КД УПРАВЛЕНИЕ':'КД ЗАМЕРЩИК';el('subtitle').textContent=role==='owner'?'Панель собственника · прототип':'Рабочее место замерщика · прототип';
let html='';
if(screen==='home'&&role==='owner'){
html='<div class="kpis">'+['Сумма заказов','К получению','Заказы в работе','Активные клиенты'].map(x=>'<div class="kpi"><small>'+x+'</small><strong>—</strong></div>').join('')+'</div><section class="panel"><h2>Требует внимания</h2><small>Данные задач и сроков пока не подключены.</small></section><h2 class="section-title">Управление предприятием</h2><div class="tiles">'+owner.map(x=>button(x[0],x[1])).join('')+'</div><section class="panel"><h2>КД — Умный помощник</h2><small>Запросы к данным без API ИИ</small>'+questions.map(x=>'<button class="question" data-go="'+x[0]+'" type="button">'+x[1]+icon('arrow')+'</button>').join('')+'</section>';
}else if(screen==='home'){
html=action('quick','Быстрый расчёт','Без обязательного создания заказа',true)+action('measure','Новый замер объекта','Размеры, схема и общая смета')+'<h2 class="section-title">Работа с клиентами</h2><div class="tiles survey">'+survey.map(x=>button(x[0],x[1])).join('')+'</div><section class="panel"><h2>Продолжить расчёт</h2><small>Черновики в прототипе не загружаются.</small></section>';
}else if(screen==='menu'){
html='<section class="detail"><h1>Рабочие пространства</h1><p>Демонстрационное переключение. В рабочей версии доступ определяется серверной ролью.</p><div class="workspace"><button data-role="owner">КД Управление — собственник</button><button data-role="surveyor">КД Замерщик — замерщик</button></div></section>';
}else{
const data=[...owner,...survey,['quick','Быстрый расчёт','Единый редактор изделий.'],['measure','Новый замер','План объекта и общая смета.'],['alerts','Уведомления','Отклонения и сроки.']].find(x=>x[0]===screen);
html='<section class="detail"><button class="icon-btn back" data-go="home" aria-label="На главную">'+icon('back')+'</button><h1>'+(data?.[1]||'Раздел')+'</h1><p>'+(data?.[2]||'')+'</p><div class="panel">Раздел пока не подключён к рабочей системе. В этом прототипе нет операций с заказами или клиентами.</div></section>';
}
el('content').innerHTML=html;
const nav=role==='owner'?[['home','Главная'],['orders','Заказы'],['clients','Клиенты'],['factory','Цех'],['menu','Ещё']]:[['home','Главная'],['calc','Расчёты'],['clients','Клиенты'],['menu','Ещё']];
el('nav').innerHTML=nav.map(x=>'<button type="button" data-go="'+x[0]+'"'+(screen===x[0]?' aria-current="page"':'')+'>'+icon(x[0])+'<span>'+x[1]+'</span></button>').join('');
}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go)show(go.dataset.go);const r=e.target.closest('[data-role]');if(r&&['owner','surveyor'].includes(r.dataset.role)){role=r.dataset.role;show('home')}});
el('menu').addEventListener('click',()=>show('menu'));el('alerts').addEventListener('click',()=>show('alerts'));el('theme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';try{localStorage.setItem('kd-v2-preview-theme',theme)}catch{}render()});
render();
</script>
</body>
</html>
