name: Deploy production to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kuznechny-dvorik-gates.boss-nedvetskiy.workers.dev/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check runtime-price-adjustment.js
          node --check gate-page-ui.js
          node --check color-photo-site.js
          node --check shared/customer-context.js
          node --check shared/delivery.js
          node --check shared/leads.js
          node --check public-site-settings.js
          node --check admin.js
          node --check admin-colors.js
          node --check admin-color-atomic.js
          node --check admin-prices.js
          node --check admin-site.js
          node --check admin-delivery.js
          node --check admin-leads.js
          node --check admin-workflow.js
          node --check admin-tabs-fix.js
          node --check admin-history.js
          node --check admin-guidance.js
          node --check worker/runtime.js
          node --check worker/auth-d1.js
          node --check worker/site-settings-d1.js
          node --check worker/gate-quote-d1.js
          node --check worker/lead-antispam.js
          node --check worker/catalog-media-d1.js
          node --check worker/catalog-colors-d1.js
          node --check worker/leads-d1.js
          node --check worker/admin-enhancements-d1.js
          node --check worker/admin-color-atomic-d1.js
          node --check worker/admin-media-cleanup-d1.js
          node --check scripts/build.mjs
          node --check scripts/test-color-photos.mjs
          node --check scripts/e2e-server.mjs

      - name: Verify catalog images
        run: node scripts/test-catalog-images.mjs

      - name: Verify color photo flow
        run: node scripts/test-color-photos.mjs

      - name: Verify gate page foundation
        run: node scripts/test-gate-page.mjs

      - name: Verify gate calculator
        run: node scripts/test-gate-calculator.mjs

      - name: Verify server gate quote
        run: node scripts/test-server-gate-quote.mjs

      - name: Build production Worker
        run: npm run build

      - name: Check built Worker syntax
        run: node --check dist/server/index.js

      - name: Install browser tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Deploy to Cloudflare Workers
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//;s/[[:space:]]+$//;s/^Bearer[[:space:]]+//')"
          token="${token#\"}"
          token="${token%\"}"
          token="${token#\'}"
          token="${token%\'}"
          account_id="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n[:space:]')"

          if [ -z "$token" ] || [ -z "$account_id" ]; then
            echo "::error::Cloudflare credentials are empty after normalization."
            exit 1
          fi

          export CLOUDFLARE_API_TOKEN="$token"
          export CLOUDFLARE_ACCOUNT_ID="$account_id"
          npx --yes wrangler@4 deploy

      - name: Verify production site and admin
        run: |
          node <<'NODE'
          const rootUrl = 'https://kuznechny-dvorik-gates.boss-nedvetskiy.workers.dev/';
          const adminUrl = rootUrl + 'admin';
          const rootRequired = [
            'Ворота с калиткой',
            'Сейчас оплачивать ничего не нужно.',
            'Зачем нужен замерщик, если я знаю свои размеры?',
            'Предпочитаемый цвет:',
            'Выберите цвет профнастила',
            'Нажмите на нужный цвет',
            'noindex,follow,noarchive'
          ];
          const adminRequired = [
            'Доставка по населённым пунктам',
            'Работа с заявкой',
            'История цен',
            'Очистить неиспользуемые фото',
            'базовая цена стандартного размера'
          ];

          let lastError;
          for (let attempt = 1; attempt <= 5; attempt += 1) {
            try {
              const [rootResponse, adminResponse] = await Promise.all([
                fetch(rootUrl, {cache:'no-store'}),
                fetch(adminUrl, {cache:'no-store'})
              ]);
              if (!rootResponse.ok) throw new Error(`Root HTTP ${rootResponse.status}`);
              if (!adminResponse.ok) throw new Error(`Admin HTTP ${adminResponse.status}`);
              const [rootHtml, adminHtml] = await Promise.all([rootResponse.text(), adminResponse.text()]);
              const missingRoot = rootRequired.filter(text => !rootHtml.includes(text));
              const missingAdmin = adminRequired.filter(text => !adminHtml.includes(text));
              if (missingRoot.length) throw new Error(`Missing root text: ${missingRoot.join(' | ')}`);
              if (missingAdmin.length) throw new Error(`Missing admin text: ${missingAdmin.join(' | ')}`);
              console.log(`Production deployment verified: ${rootUrl}`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Production verification attempt ${attempt}/5 failed: ${error.message}`);
              if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 2000));
            }
          }
          throw lastError;
          NODE

# Production deploy is intentionally separate from the GitHub Pages preview.
