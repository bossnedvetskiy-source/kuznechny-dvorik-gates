name: Deploy production to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kuznechny-dvorik-gates.boss-nedvetskiy.workers.dev/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check gate-page-ui.js
          node --check color-photo-site.js
          node --check gate-formula-prices-site.js
          node --check gate-calc-engine.js
          node --check public-lazy-runtime.js
          node --check shared/customer-context.js
          node --check shared/delivery.js
          node --check shared/leads.js
          node --check public-site-settings.js
          node --check admin.js
          node --check admin-colors.js
          node --check admin-prices.js
          node --check admin-site.js
          node --check admin-leads.js
          node --check admin-enhancements.js
          node --check admin-excel-import.js
          node --check worker/runtime.js
          node --check worker/auth-d1.js
          node --check worker/site-settings-d1.js
          node --check worker/excel-pricing-d1.js
          node --check worker/gate-quote-d1.js
          node --check worker/public-prices-runtime.js
          node --check worker/lead-antispam.js
          node --check worker/catalog-media-d1.js
          node --check worker/catalog-colors-d1.js
          node --check worker/leads-d1.js
          node --check scripts/build.mjs
          node --check scripts/test-color-photos.mjs
          node --check scripts/test-admin-integrity.mjs

      - name: Verify catalog images
        run: node scripts/test-catalog-images.mjs

      - name: Verify color photo flow
        run: node scripts/test-color-photos.mjs

      - name: Verify admin integrity
        run: node scripts/test-admin-integrity.mjs

      - name: Verify gate page foundation
        run: node scripts/test-gate-page.mjs

      - name: Verify gate calculator
        run: node scripts/test-gate-calculator.mjs

      - name: Verify server gate quote
        run: node scripts/test-server-gate-quote.mjs

      - name: Build production Worker
        run: npm run build

      - name: Check built output syntax
        run: |
          node --check dist/server/index.js
          node --check dist/client/site.bundle.js
          node --check dist/client/calculator.bundle.js
          node --check dist/client/catalog-enhancements.bundle.js
          test -s dist/client/site.css
          test -s dist/client/site.bundle.js
          test -s dist/client/calculator.bundle.js
          test -s dist/client/catalog-enhancements.bundle.js

      - name: Deploy to Cloudflare Workers
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//;s/[[:space:]]+$//;s/^Bearer[[:space:]]+//')"
          token="${token#\"}"
          token="${token%\"}"
          token="${token#\'}"
          token="${token%\'}"
          account_id="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n[:space:]')"

          if [ -z "$token" ] || [ -z "$account_id" ]; then
            echo "::error::Cloudflare credentials are empty after normalization."
            exit 1
          fi

          export CLOUDFLARE_API_TOKEN="$token"
          export CLOUDFLARE_ACCOUNT_ID="$account_id"
          npx --yes wrangler@4 deploy

      - name: Verify production site
        run: |
          node <<'NODE'
          const base = 'https://kuznechny-dvorik-gates.boss-nedvetskiy.workers.dev';
          const siteUrl = `${base}/`;
          const cssUrl = `${base}/site.css`;
          const bundleUrl = `${base}/site.bundle.js`;
          const calculatorUrl = `${base}/calculator.bundle.js`;
          const enhancementsUrl = `${base}/catalog-enhancements.bundle.js`;
          const adminUrl = `${base}/admin`;
          const requiredSite = [
            'Ворота с калиткой',
            'Сейчас оплачивать ничего не нужно.',
            'Зачем нужен замерщик, если я знаю свои размеры?',
            '/site.css',
            '/site.bundle.js'
          ];
          const requiredInitialBundle = [
            'KUZDVOR_ENSURE_CALCULATOR',
            'KUZDVOR_SCHEDULE_CATALOG_DATA',
            '/calculator.bundle.js',
            '/catalog-enhancements.bundle.js'
          ];
          const forbiddenInitialBundle = [
            'GATE_CALC_MODELS_READY',
            'KUZDVOR_FORMULA_PRICE_SYNC_READY'
          ];
          const requiredCalculatorBundle = [
            'syncExcelDerivedGatePrices',
            'standardForArticle',
            'KUZDVOR_FORMULA_PRICE_SYNC_READY',
            'GATE_CALC_MODELS_READY'
          ];
          const requiredEnhancementsBundle = [
            'KUZDVOR_COLOR_PHOTO_SITE_READY',
            '/api/catalog-images'
          ];
          const forbiddenPublic = ['runtimeCatalogPrice','targetStandardPrice'];
          const requiredAdmin = [
            'CSV с рекламой',
            'Источник цен ворот — Excel',
            'Цены ворот не редактируются вручную',
            'Скачать текущий Excel',
            'Загрузить изменённый Excel',
            'Опубликовать расчёт из Excel',
            '/api/admin/gate-excel/file',
            '/api/admin/gate-excel',
            'reconcileTab'
          ];

          let lastError;
          for (let attempt = 1; attempt <= 5; attempt += 1) {
            try {
              const [siteResponse, cssResponse, bundleResponse, calculatorResponse, enhancementsResponse, adminResponse] = await Promise.all([
                fetch(siteUrl, { cache: 'no-store' }),
                fetch(cssUrl, { cache: 'no-store' }),
                fetch(bundleUrl, { cache: 'no-store' }),
                fetch(calculatorUrl, { cache: 'no-store' }),
                fetch(enhancementsUrl, { cache: 'no-store' }),
                fetch(adminUrl, { cache: 'no-store' })
              ]);
              if (!siteResponse.ok) throw new Error(`Site HTTP ${siteResponse.status}`);
              if (!cssResponse.ok) throw new Error(`Public CSS HTTP ${cssResponse.status}`);
              if (!bundleResponse.ok) throw new Error(`Initial public bundle HTTP ${bundleResponse.status}`);
              if (!calculatorResponse.ok) throw new Error(`Calculator bundle HTTP ${calculatorResponse.status}`);
              if (!enhancementsResponse.ok) throw new Error(`Catalog enhancements bundle HTTP ${enhancementsResponse.status}`);
              if (!adminResponse.ok) throw new Error(`Admin HTTP ${adminResponse.status}`);
              const [siteHtml, publicCss, publicBundle, calculatorBundle, enhancementsBundle, adminHtml] = await Promise.all([
                siteResponse.text(), cssResponse.text(), bundleResponse.text(), calculatorResponse.text(), enhancementsResponse.text(), adminResponse.text()
              ]);
              const missingSite = requiredSite.filter(text => !siteHtml.includes(text));
              const missingInitial = requiredInitialBundle.filter(text => !publicBundle.includes(text));
              const leakedInitial = forbiddenInitialBundle.filter(text => publicBundle.includes(text));
              const missingCalculator = requiredCalculatorBundle.filter(text => !calculatorBundle.includes(text));
              const missingEnhancements = requiredEnhancementsBundle.filter(text => !enhancementsBundle.includes(text));
              const forbiddenPresent = forbiddenPublic.filter(text => siteHtml.includes(text) || publicBundle.includes(text) || calculatorBundle.includes(text));
              const missingAdmin = requiredAdmin.filter(text => !adminHtml.includes(text));
              if (missingSite.length) throw new Error(`Missing production site text: ${missingSite.join(' | ')}`);
              if (missingInitial.length) throw new Error(`Missing initial public bundle code: ${missingInitial.join(' | ')}`);
              if (leakedInitial.length) throw new Error(`Heavy calculator leaked into initial bundle: ${leakedInitial.join(' | ')}`);
              if (missingCalculator.length) throw new Error(`Missing calculator bundle code: ${missingCalculator.join(' | ')}`);
              if (missingEnhancements.length) throw new Error(`Missing catalog enhancement code: ${missingEnhancements.join(' | ')}`);
              if (!publicCss.includes('.catalog-grid')) throw new Error('Public CSS does not contain catalog styles');
              if (forbiddenPresent.length) throw new Error(`Forbidden manual pricing logic in production: ${forbiddenPresent.join(' | ')}`);
              if (missingAdmin.length) throw new Error(`Missing production admin text: ${missingAdmin.join(' | ')}`);
              console.log(`Production deployment verified: ${siteUrl}`);
              console.log(`HTML ${Buffer.byteLength(siteHtml)} bytes; CSS ${Buffer.byteLength(publicCss)} bytes; initial JS ${Buffer.byteLength(publicBundle)} bytes; calculator JS ${Buffer.byteLength(calculatorBundle)} bytes; catalog enhancements JS ${Buffer.byteLength(enhancementsBundle)} bytes`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Production verification attempt ${attempt}/5 failed: ${error.message}`);
              if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 2000));
            }
          }

          throw lastError;
          NODE

# Production deploy is intentionally separate from the GitHub Pages preview.
