name: Cleanup admin photo editor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply cleanup
        run: python3 .github/cleanup-admin-photo-editor.py
      - name: Syntax checks
        run: |
          node --check admin.js
          node --check app.js
          node --check worker/auth-d1.js
      - name: Foundation tests
        run: node scripts/test-gate-page.mjs
      - name: Calculator tests
        run: node scripts/test-gate-calculator.mjs
      - name: Production build
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html admin.js admin.css scripts/test-gate-page.mjs
          if git diff --cached --quiet; then
            echo "No admin cleanup changes"
            exit 0
          fi
          git commit -m "Remove obsolete admin photo crop code"
          git push
