name: Apply favorites complete fix

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-favorites-complete-fix-ci.py
      - .github/workflows/apply-favorites-complete-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-favorites-complete-fix
  cancel-in-progress: true

env:
  CI: true

jobs:
  apply-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply favorites_complete_fix and update E2E
        run: python3 scripts/apply-favorites-complete-fix-ci.py

      - name: Align E2E with production loading and location UX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          server = Path('scripts/e2e-server.mjs')
          text = server.read_text(encoding='utf-8')
          marker = '<script src="shared/favorites.js"></script>'
          if marker not in text:
              needle = '<script src="gate-page-ui.js"></script>\n  <script src="color-photo-site.js"></script>'
              replacement = '<script src="gate-page-ui.js"></script>\n  <script src="shared/favorites.js"></script>\n  <script src="color-photo-site.js"></script>'
              if needle not in text:
                  raise SystemExit('Could not add favorites to E2E source environment')
              text = text.replace(needle, replacement, 1)
              server.write_text(text, encoding='utf-8')

          favorites = Path('shared/favorites.js')
          text = favorites.read_text(encoding='utf-8')
          guarded = "      const state = active ? '1' : '0';\n      if (button.dataset.favoriteState === state) return;\n      button.dataset.favoriteState = state;"
          if guarded not in text:
              needle = "      const active = favorites.has(button.dataset.favoriteId);\n      button.setAttribute('aria-pressed', String(active));"
              replacement = "      const active = favorites.has(button.dataset.favoriteId);\n      const state = active ? '1' : '0';\n      if (button.dataset.favoriteState === state) return;\n      button.dataset.favoriteState = state;\n      button.setAttribute('aria-pressed', String(active));"
              if needle not in text:
                  raise SystemExit('Favorites sync marker not found')
              text = text.replace(needle, replacement, 1)
              favorites.write_text(text, encoding='utf-8')

          helper = Path('tests/location-helpers.js')
          helper.write_text(dedent("""\
          import {expect} from '@playwright/test';

          export async function openLocationSelector(page) {
            const modal = page.locator('#catalogLocationGateModal');
            const autoOpened = await modal.waitFor({state:'visible',timeout:2500}).then(() => true).catch(() => false);
            if (!autoOpened) {
              const lockButton = page.locator('.catalog-location-lock button');
              if (await lockButton.isVisible().catch(() => false)) {
                await lockButton.evaluate(element => element.click());
              } else {
                await page.evaluate(() => document.querySelector('a[href="#catalog"]')?.click());
              }
            }
            await expect(modal).toBeVisible({timeout:5000});
            return {
              modal,
              input:page.locator('#installationLocationInput'),
              action:page.locator('#installationLocationAction'),
              status:page.locator('#installationLocationStatus')
            };
          }

          export async function beginInstallationPlace(page, place) {
            const firstCard = page.locator('#catalogGrid .product-card').first();
            if (await firstCard.isVisible().catch(() => false)) return {selected:true, firstCard};
            const ui = await openLocationSelector(page);
            await ui.input.fill(place);
            if (await firstCard.isVisible().catch(() => false)) return {...ui, selected:true, firstCard};
            await expect(ui.action).toBeEnabled();
            await ui.action.click();
            return {...ui, selected:false, firstCard};
          }

          export async function selectInstallationPlace(page, place='Мелеуз') {
            const firstCard = page.locator('#catalogGrid .product-card').first();
            if (await firstCard.isVisible().catch(() => false)) return firstCard;
            const ui = await beginInstallationPlace(page, place);
            if (await firstCard.isVisible().catch(() => false)) return firstCard;
            if (await ui.modal?.isVisible().catch(() => false)) {
              await expect(ui.action).toBeEnabled({timeout:10000});
              const text = String(await ui.action.textContent() || '');
              if (/Да, это нужный пункт/.test(text)) await ui.action.click();
            }
            await expect(firstCard).toBeVisible({timeout:10000});
            return firstCard;
          }

          export async function openMobileAt(page, place='Мелеуз') {
            await page.setViewportSize({width:390,height:844});
            await page.goto('/', {waitUntil:'domcontentloaded'});
            return selectInstallationPlace(page, place);
          }
          """), encoding='utf-8')

          prices = Path('tests/delivery-card-prices.spec.js')
          text = prices.read_text(encoding='utf-8').replace('73 240 ₽','73 200 ₽').replace('98 240 ₽','98 200 ₽')
          prices.write_text(text, encoding='utf-8')

          gates = Path('tests/gate-e2e.spec.js')
          text = gates.read_text(encoding='utf-8')
          text = text.replace("  await expect(page.locator('#mobilePriceTotal')).toContainText('доставка индивидуально');\n", '')
          text = text.replace("  await expect(page.locator('#mobilePrimaryCta')).toContainText('доставка индивидуально');\n", '')
          gates.write_text(text, encoding='utf-8')

          leads = Path('shared/leads.js')
          leads.write_text(leads.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build production package
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Verify favorites is bundled
        run: |
          grep -Fq 'KUZDVOR_FAVORITES' dist/client/site.bundle.js
          test -s dist/client/site.bundle.js

      - name: Commit and push tested code only
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/deploy-timeweb-main.yml
          rm -rf test-results
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build.mjs shared/leads.js shared/favorites.js scripts/e2e-server.mjs tests/location-helpers.js tests/gate-e2e.spec.js tests/delivery-card-prices.spec.js tests/lightbox-history.spec.js tests/favorites.spec.js
          git diff --cached --check
          git commit -m 'Bundle favorites and update location E2E'
          git push origin HEAD:main
