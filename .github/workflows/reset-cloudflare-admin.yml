name: Reset Cloudflare admin for migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_MIGRATION_PASSWORD: ${{ secrets.CF_MIGRATION_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: timeweb-migration

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate reset secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_MIGRATION_PASSWORD:-}" || { echo "Missing CF_MIGRATION_PASSWORD repository secret" >&2; exit 1; }
          if [ "${#CF_MIGRATION_PASSWORD}" -lt 10 ]; then
            echo "CF_MIGRATION_PASSWORD must be at least 10 characters" >&2
            exit 1
          fi

      - name: Build one-time password reset SQL
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const password = process.env.CF_MIGRATION_PASSWORD || '';
          if (password.length < 10) process.exit(2);
          const salt = crypto.randomBytes(32).toString('hex');
          const hash = crypto.pbkdf2Sync(password, salt, 210000, 32, 'sha256').toString('hex');
          const sessionSecret = crypto.randomBytes(32).toString('hex');
          const sql = [
            "UPDATE admin_auth",
            "SET username='migration',",
            `    password_salt='${salt}',`,
            `    password_hash='pbkdf2-sha256$210000$${hash}',`,
            `    session_secret='${sessionSecret}',`,
            "    updated_at=CURRENT_TIMESTAMP",
            "WHERE id=1;"
          ].join('\n');
          fs.writeFileSync('/tmp/reset-admin.sql', sql, { mode: 0o600 });
          NODE

      - name: Reset D1 admin credentials
        run: npx wrangler d1 execute kuznechny-dvorik-gates-db --remote --file=/tmp/reset-admin.sql

      - name: Verify username only
        run: npx wrangler d1 execute kuznechny-dvorik-gates-db --remote --command="SELECT id, username FROM admin_auth WHERE id=1;"
