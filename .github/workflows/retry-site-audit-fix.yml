name: Retry site audit fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-site-audit-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/site-audit-fix.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('pattern.subn(replacement, app, count=1)','pattern.subn(lambda m: replacement, app, count=1)')
          s=s.replace('if count != 1:','if count > 1:')
          start=s.index('# ---------- worker/leads-d1.js ----------')
          end=s.index('# ---------- admin-leads.js ----------')
          s=s[:start]+'# worker/leads-d1.js was patched directly before this run.\n\n'+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply audit fixes
        run: python3 .github/site-audit-fix.py
      - name: Run gate calculator tests
        run: node scripts/test-gate-calculator.mjs
      - name: Build production worker
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/site-audit-fix.py index.html storefront.css public-site-settings.js app.js admin-leads.js
          git commit -m "Improve conversion flow after full site audit"
          git push origin main
