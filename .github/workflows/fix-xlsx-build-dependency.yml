name: Fix Excel build dependency install

on:
  push:
    paths:
      - '.github/workflows/fix-xlsx-build-dependency.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Ensure build dependencies include XLSX
        shell: python
        run: |
          from pathlib import Path
          for name in ['.github/workflows/deploy-cloudflare.yml', '.github/workflows/deploy-preview.yml']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              old = 'npm install --no-audit --no-fund'
              new = 'npm install --include=dev --no-audit --no-fund'
              if old in s:
                  s = s.replace(old, new)
              elif new not in s:
                  raise SystemExit(f'Install command not found in {name}')
              p.write_text(s, encoding='utf-8')

      - name: Commit dependency install fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-cloudflare.yml .github/workflows/deploy-preview.yml
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Install Excel build dependency in CI [skip ci]'
          git push origin main
