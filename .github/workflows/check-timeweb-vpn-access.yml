name: Check Timeweb VPN access

on:
  push:
    branches: [diagnostics-vpn]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Direct IPv4 and IPv6 probes
        shell: bash
        run: |
          set -u
          echo '=== DNS ==='
          getent ahosts kuzdvor.tw1.ru || true
          echo
          echo '=== IPv4 HTTPS ==='
          curl -4 -vI --connect-timeout 10 --max-time 15 https://kuzdvor.tw1.ru/ 2>&1 || true
          echo
          echo '=== IPv6 HTTPS ==='
          curl -6 -vI --connect-timeout 10 --max-time 15 https://kuzdvor.tw1.ru/ 2>&1 || true
          echo
          echo '=== IPv4 HTTP ==='
          curl -4 -vI --connect-timeout 10 --max-time 15 http://kuzdvor.tw1.ru/ 2>&1 || true
          echo
          echo '=== TLS to IPv4 with SNI ==='
          timeout 12 openssl s_client -connect 92.53.96.116:443 -servername kuzdvor.tw1.ru -brief </dev/null 2>&1 || true
