name: Multi-product foundation v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply foundation refactor
        run: python3 .github/multiproduct-v2.py

      - name: Verify gate calculator
        run: node scripts/test-gate-calculator.mjs

      - name: Build production worker
        run: npm run build

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js admin.html admin-prices.js admin-site.js admin-leads.js scripts/build.mjs worker/site-settings-d1.js
          git commit -m "Prepare site for multiple product categories"
          git push
