name: Build Timeweb from main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timeweb-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout production source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Verify Timeweb source is in main
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/build-timeweb.mjs
          test -s timeweb/.htaccess
          test -s timeweb/local-api.php
          test -s timeweb/backend/bootstrap.php
          test -s timeweb/backend/schema.mysql.sql
          test -s timeweb/deploy-timeweb.sh
          test -s timeweb/health-check.sh

      - name: Install build dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Normalize XLSX browser bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s node_modules/xlsx/dist/xlsx.full.min.js ]; then
            test -s node_modules/xlsx/xlsx.js
            mkdir -p node_modules/xlsx/dist
            cp node_modules/xlsx/xlsx.js node_modules/xlsx/dist/xlsx.full.min.js
          fi

      - name: Build current main site
        run: npm run build

      - name: Prepare Timeweb package
        run: node scripts/build-timeweb.mjs

      - name: Harden Timeweb package
        shell: bash
        run: KUZDVOR_SOURCE_SHA="$(git rev-parse HEAD)" node scripts/harden-timeweb.mjs

      - name: Verify Timeweb package
        shell: bash
        run: |
          set -euo pipefail
          test -s timeweb-dist/index.html
          test -s timeweb-dist/admin.html
          test -s timeweb-dist/site.css
          test -s timeweb-dist/site.bundle.js
          test -s timeweb-dist/xlsx.bundle.js
          test -s timeweb-dist/deployment-version.json
          grep -Fq '<script src="/xlsx.bundle.js"></script>' timeweb-dist/admin.html
          if grep -Fq 'unsupported format |' timeweb-dist/admin.html; then
            echo 'XLSX library was inlined into admin HTML again' >&2
            exit 1
          fi
          grep -Fq 'С учётом доставки' timeweb-dist/site.bundle.js
          test -s timeweb-dist/local-api.php
          test -s timeweb-dist/backend/bootstrap.php
          test -s timeweb-dist/backend/schema.mysql.sql
          test -s timeweb-dist/backend/defaults.json
          test -s timeweb-dist/.htaccess
          test ! -e timeweb-dist/api-proxy.php
          test ! -e timeweb-dist/setup-timeweb.php
          test ! -e timeweb-dist/migrate-from-cloudflare.php
          test ! -e timeweb-dist/migrate-public-catalog.php
          grep -Fq 'SetEnv HOME /home/c/cp59598/kuznechny-dvorik-gates' timeweb-dist/.htaccess
          grep -Fq 'RewriteCond %{HTTP:X-Forwarded-Proto} !https [NC]' timeweb-dist/.htaccess
          grep -Fq 'Strict-Transport-Security' timeweb-dist/.htaccess
          grep -Fq 'RewriteRule ^api/(.*)$ local-api.php?__route=$1 [QSA,L]' timeweb-dist/.htaccess
          grep -Fq 'RewriteRule ^catalog-media/(.*)$ local-api.php?__route=catalog-media/$1 [QSA,L]' timeweb-dist/.htaccess
          if grep -Fq 'api-proxy.php?__proxy_path' timeweb-dist/.htaccess; then
            echo 'Timeweb .htaccess still routes production traffic through Cloudflare proxy' >&2
            exit 1
          fi
          if grep -Fq "'detail' => \$e->getMessage()" timeweb-dist/local-api.php; then
            echo 'Timeweb API still exposes internal exception details' >&2
            exit 1
          fi
          grep -Fq '$healthy ? 200 : 503' timeweb-dist/local-api.php
          php -l timeweb-dist/local-api.php
          php -l timeweb-dist/backend/bootstrap.php
          echo "Prepared $(find timeweb-dist -type f | wc -l) files for Timeweb"

      - name: Publish generated files to timeweb-public
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          rm -rf /tmp/timeweb-dist
          cp -a timeweb-dist /tmp/timeweb-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan timeweb-public
          git rm -rf . || true
          git clean -fdx
          cp -a /tmp/timeweb-dist/. .
          git add -A
          git commit -m "Build Timeweb site from main ${source_sha}"
          git push --force origin HEAD:timeweb-public

      - name: Verify live Timeweb deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://kuzdvor.tw1.ru'
          expected_sha="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('deployment-version.json','utf8')).sourceSha)")"
          live_sha=''
          reachable=0
          matched=0
          last_diag=''

          echo "Checking Timeweb auto-deploy of ${expected_sha} across a full 5-minute cron window..."
          for attempt in $(seq 1 42); do
            : > /tmp/timeweb-version.json
            : > /tmp/timeweb-curl-error.txt
            code="$(curl -sS --connect-timeout 3 --max-time 6 -o /tmp/timeweb-version.json -w '%{http_code}' "${base}/deployment-version.json?check=${attempt}&expected=${expected_sha}" 2>/tmp/timeweb-curl-error.txt || true)"
            live_sha="$(node -e "const fs=require('fs');try{process.stdout.write(JSON.parse(fs.readFileSync('/tmp/timeweb-version.json','utf8')).sourceSha||'')}catch{}" 2>/dev/null || true)"
            echo "Attempt ${attempt}/42: HTTP ${code:-000}; live=${live_sha:-unavailable}; expected=${expected_sha}"
            if [ -n "$code" ] && [ "$code" != '000' ]; then reachable=1; fi
            if [ "$code" = '200' ] && [ "$live_sha" = "$expected_sha" ]; then
              matched=1
              echo 'Timeweb is serving the current main commit.'
              break
            fi

            diag_code="$(curl -sS --connect-timeout 3 --max-time 6 -o /tmp/timeweb-deploy-status.txt -w '%{http_code}' "${base}/deployment-health-status.txt?check=${attempt}&expected=${expected_sha}" 2>/dev/null || true)"
            if [ "$diag_code" = '200' ]; then
              last_diag="$(sed -n '1,8p' /tmp/timeweb-deploy-status.txt | tr '\n' ' ')"
              diag_status="$(sed -n 's/^status=//p' /tmp/timeweb-deploy-status.txt | head -n1)"
              diag_target="$(sed -n 's/^target_source_sha=//p' /tmp/timeweb-deploy-status.txt | head -n1)"
              diag_stage="$(sed -n 's/^stage=//p' /tmp/timeweb-deploy-status.txt | head -n1)"
              echo "Timeweb deploy diagnostic: ${last_diag:-empty}"
              if [ "$diag_status" = 'failed' ] && [ "$diag_target" = "$expected_sha" ]; then
                echo "::error::Timeweb cron attempted ${expected_sha} but rolled it back during health-check stage '${diag_stage:-unknown}'."
                exit 1
              fi
            fi
            sleep 10
          done

          if [ "$matched" != '1' ]; then
            if [ "$reachable" = '0' ]; then
              echo '::warning::Timeweb is unreachable from this GitHub-hosted runner. The Timeweb-side cron deployer remains authoritative and performs its own health check with automatic rollback.'
              if [ -s /tmp/timeweb-curl-error.txt ]; then sed -n '1,3p' /tmp/timeweb-curl-error.txt; fi
              exit 0
            fi
            if [ -n "$last_diag" ]; then echo "Last Timeweb deploy diagnostic: $last_diag"; fi
            echo "::error::Timeweb is reachable, but current main ${expected_sha} is not live after the full cron window. If no diagnostic targets this SHA, verify that the Timeweb Crontab task is still enabled."
            exit 1
          fi

          curl -fsS --connect-timeout 4 --max-time 15 --retry 1 --retry-delay 2 -D /tmp/timeweb-health.headers -o /tmp/timeweb-health.json "${base}/api/health"
          grep -Eiq '^X-Kuzdvor-Backend:[[:space:]]*timeweb-php' /tmp/timeweb-health.headers
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/timeweb-health.json','utf8'));
          if (health.ok !== true || health.configured !== true || health.db !== true || health.backend !== 'timeweb-php') {
            throw new Error(`Unhealthy Timeweb backend: ${JSON.stringify(health)}`);
          }
          if ('error' in health || 'detail' in health) throw new Error(`Health endpoint exposes internal error fields: ${JSON.stringify(health)}`);
          NODE

          curl -fsS --connect-timeout 4 --max-time 15 --retry 1 --retry-delay 2 -o /tmp/timeweb-admin.html "${base}/admin"
          grep -Fq '<script src="/xlsx.bundle.js"></script>' /tmp/timeweb-admin.html
          if grep -Fq 'unsupported format |' /tmp/timeweb-admin.html; then
            echo '::error::Live admin still contains the inlined XLSX library.'
            exit 1
          fi

          curl -fsS --connect-timeout 4 --max-time 15 --retry 1 --retry-delay 2 -o /tmp/timeweb-site.js "${base}/site.bundle.js"
          grep -Fq 'С учётом доставки' /tmp/timeweb-site.js
          curl -fsS --connect-timeout 4 --max-time 15 --retry 1 --retry-delay 2 -o /dev/null "${base}/xlsx.bundle.js"

          legacy_code="$(curl -sS --connect-timeout 4 --max-time 15 -o /dev/null -w '%{http_code}' "${base}/api-proxy.php?__proxy_path=api/health" || true)"
          case "$legacy_code" in 403|404) ;; *) echo "::error::Legacy Cloudflare proxy is still reachable (HTTP ${legacy_code:-000})."; exit 1;; esac

          curl -sSI --connect-timeout 4 --max-time 15 "${base}/" > /tmp/timeweb-https-headers.txt
          grep -Eiq '^strict-transport-security:[[:space:]]*max-age=31536000' /tmp/timeweb-https-headers.txt

          curl -sSI --connect-timeout 4 --max-time 15 'http://kuzdvor.tw1.ru/' > /tmp/timeweb-http-headers.txt
          status="$(awk 'NR==1{print $2}' /tmp/timeweb-http-headers.txt)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,"",$2); print $2; exit}' /tmp/timeweb-http-headers.txt)"
          case "$status" in 301|302|307|308) ;; *) echo "::error::HTTP is not redirected to HTTPS (status $status)."; exit 1;; esac
          case "$location" in https://kuzdvor.tw1.ru/*) ;; *) echo "::error::Unexpected HTTP redirect target: ${location:-missing}"; exit 1;; esac

          echo 'Live Timeweb verification passed: current main, local PHP/MySQL, admin XLSX, delivery prices, legacy proxy removal and HTTPS are healthy.'