name: One-off mobile catalog polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-mobile-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Polish mobile catalog UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          block=r'''
  <style data-catalog-mobile-polish="2026-09-08">
    @media(max-width:620px){
      .catalog{padding-top:46px!important}
      .catalog .section-head{margin-bottom:14px!important}
      .catalog-price-context{margin:0 0 8px!important;color:#777168!important;font-size:11px!important;line-height:1.35!important}
      .filterbar{display:grid!important;grid-template-columns:1fr!important;gap:9px!important;padding-bottom:13px!important;margin-bottom:14px!important}
      .filter-tabs{gap:6px!important;padding-bottom:0!important}
      .filter-tabs .filter{min-height:38px!important;padding:7px 8px!important;font-size:12px!important}
      .catalog-tools{display:flex!important;align-items:center!important;justify-content:flex-start!important;width:100%!important}
      .catalog-tools .sort-label{display:flex!important;align-items:center!important;gap:9px!important;width:auto!important;font-size:11px!important}
      .catalog-tools .sort-label select{width:auto!important;min-width:168px!important;height:40px!important;min-height:40px!important;padding:0 34px 0 11px!important;font-size:13px!important}
      .catalog-summary{margin:-1px 0 12px!important;font-size:11px!important}

      .product-card .product-visual{aspect-ratio:1.9/1!important;min-height:0!important}
      .product-card.photo .product-image-open img{object-fit:contain!important;object-position:center!important;transform:none!important}
      .product-info{padding-top:13px!important}
      .product-meta{margin-bottom:11px!important}
      .product-meta span{padding:5px 8px!important;font-size:10px!important}
      .card-gallery-arrow{width:38px!important;height:38px!important;font-size:25px!important}
      .product-photo-count{font-size:11px!important;padding:6px 9px!important}

      .mobile-cta{min-height:58px!important;height:58px!important;padding:6px 8px!important;gap:7px!important;grid-template-columns:.55fr 1.45fr!important}
      .mobile-cta a{min-height:46px!important;height:46px!important;border-radius:12px!important;font-size:12px!important;line-height:1.1!important;padding:0 8px!important;display:flex!important;align-items:center!important;justify-content:center!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
      #mobilePrimaryCta::before,#mobilePrimaryCta::after{content:none!important;display:none!important}
    }
  </style>
  <script data-catalog-mobile-polish="2026-09-08">
    (()=>{
      const catalog=document.getElementById('catalog');
      const filterbar=catalog?.querySelector('.filterbar');
      if(filterbar&&!catalog.querySelector('.catalog-price-context')){
        const note=document.createElement('p');
        note.className='catalog-price-context';
        note.textContent='Цены в фильтре — с установкой на готовые столбы';
        filterbar.before(note);
      }

      const cta=document.getElementById('mobilePrimaryCta');
      const calculator=document.getElementById('calculator');
      const total=document.getElementById('mobileEstimateTotal');
      if(!cta||!calculator)return;

      const sync=()=>{
        const price=(total?.textContent||'').trim();
        let text='Выбрать модель';
        if(!calculator.hidden){
          text=document.body.classList.contains('mobile-lead-open')
            ? `Отправить заявку · ${price}`
            : `Заказать замер · ${price}`;
        }
        if(cta.textContent!==text) cta.replaceChildren(document.createTextNode(text));
        cta.setAttribute('aria-label',text);
      };

      const schedule=()=>requestAnimationFrame(sync);
      new MutationObserver(schedule).observe(calculator,{attributes:true,attributeFilter:['hidden']});
      new MutationObserver(schedule).observe(document.body,{attributes:true,attributeFilter:['class']});
      if(total) new MutationObserver(schedule).observe(total,{childList:true,subtree:true,characterData:true});
      new MutationObserver(schedule).observe(cta,{childList:true,subtree:true,characterData:true});
      sync();
    })();
  </script>
'''
          if 'data-catalog-mobile-polish="2026-09-08"' not in s:
              if marker not in s: raise SystemExit('body marker not found')
              s=s.replace(marker,block+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish mobile catalog controls and cards"
          git push origin main
