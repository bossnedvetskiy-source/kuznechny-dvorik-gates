name: Apply gate foundation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-gate-foundation.yml'
      - '.github/patch-gate-foundation.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply gate foundation fixes
        run: python3 .github/patch-gate-foundation.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check gate-page-ui.js
          node --check public-site-settings.js
          node --check shared/customer-context.js
          node --check shared/delivery.js
          node --check shared/leads.js
      - name: Verify simplified gate page foundation
        run: node scripts/test-gate-page.mjs
      - name: Verify Excel gate calculator
        run: node scripts/test-gate-calculator.mjs
      - name: Build production worker
        run: npm run build
      - name: Commit follow-up changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build.mjs app.js shared/delivery.js gate-page-ui.js
          if git diff --cached --quiet; then
            echo "No follow-up changes"
            exit 0
          fi
          git commit -m "Harden simplified gate page flow"
          git push
