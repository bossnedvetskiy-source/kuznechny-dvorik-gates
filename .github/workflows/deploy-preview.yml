name: Deploy protected dev site

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Full regression or automatic targeted DEV checks'
        type: choice
        options: [full, auto]
        default: full

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Let an active Pages deploy finish. Cancelling an in-flight Pages deploy can
# strand GitHub's Pages backend in an "in progress deployment" state.
concurrency:
  group: dev-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Select DEV regression scope
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_MODE: ${{ inputs.mode || 'auto' }}
        run: |
          set -euo pipefail
          mode=full
          if [[ "$REQUESTED_MODE" == auto && "$GITHUB_REF" == refs/heads/dev ]]; then
            # Compare with the last successful deployment, not github.event.before.
            # Failed or cancelled builds must not hide untested changes.
            base=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-preview.yml/runs" -f branch=dev -f status=success -F per_page=1 --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
            if [[ "$base" =~ ^[0-9a-f]{40}$ ]] && { git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base"; }; then
              if git diff --no-renames --name-only -z "$base" "$GITHUB_SHA" > /tmp/kd-dev-changed; then
                mode=targeted
                sliding=false; fence=false; canopy=false
                while IFS= read -r -d '' file; do
                  case "$file" in
                    surveyor-app/sliding-gates/pricing.js|surveyor-app/sliding-gates/index.html|surveyor-app/owner-sliding.js|surveyor-app/owner-quick.js|tests/surveyor-sliding-gates.spec.js|scripts/test-owner-materials.mjs) sliding=true ;;
                    evroshtaketnik/engine.js|evroshtaketnik/evroshtaketnik.js|evroshtaketnik/evroshtaketnik.css|evroshtaketnik/index.html|tests/evroshtaketnik-mobile.spec.js|scripts/test-picket-calculator.mjs) fence=true ;;
                    naves/geometry.js|naves/pricing.js|naves/canopy-3d.js|naves/canopy-three.js|naves/drawing.js|naves/export.js|naves/naves.js|naves/naves.css|naves/index.html|tests/naves-mobile.spec.js|scripts/test-canopy-calculator.mjs) canopy=true ;;
                    *) mode=full ;;
                  esac
                done < /tmp/kd-dev-changed
                if [[ "$sliding$fence$canopy" == falsefalsefalse ]]; then mode=full; fi
              fi
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "sliding=${sliding:-false}" >> "$GITHUB_OUTPUT"
          echo "fence=${fence:-false}" >> "$GITHUB_OUTPUT"
          echo "canopy=${canopy:-false}" >> "$GITHUB_OUTPUT"
          echo "### DEV checks: $mode" >> "$GITHUB_STEP_SUMMARY"
          echo "Sliding: ${sliding:-false}; fence: ${fence:-false}; canopy: ${canopy:-false}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Normalize XLSX browser bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s node_modules/xlsx/dist/xlsx.full.min.js ]; then
            test -s node_modules/xlsx/xlsx.js
            mkdir -p node_modules/xlsx/dist
            cp node_modules/xlsx/xlsx.js node_modules/xlsx/dist/xlsx.full.min.js
          fi

      - name: Build exact Timeweb frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check dev-access.js
          node --check evroshtaketnik/engine.js
          node --check evroshtaketnik/evroshtaketnik.js
          node --check naves/geometry.js
          node --check naves/pricing.js
          node --check naves/canopy-three.js
          node --check naves/drawing.js
          node --check naves/naves.js
          node --check naves/export.js
          node --check admin-prices.js
          node --check admin-canopy.js
          node --check site-sw.js
          node --check surveyor-app/app.js
          node --check surveyor-app/3d-calculator.js
          node --check surveyor-app/3d-compact-editor.js
          node scripts/test-surveyor-3d-geometry.mjs
          node --check surveyor-app/3d-sliding-frame.js
          node --check surveyor-app/3d-sliding-render.js
          node --check surveyor-app/3d-sliding-installation.js
          node --check surveyor-app/3d-sliding-hardware.js
          node scripts/test-surveyor-3d-sliding.mjs
          node --check surveyor-app/3d-layout.js
          node scripts/test-surveyor-3d-layout.mjs
          node --check surveyor-app/3d-product-layout.js
          node scripts/test-surveyor-3d-product.mjs
          node --check surveyor-app/sw.js
          node --check worker/site-settings-d1.js
          php -l timeweb/local-api.php
          php -l timeweb/backend/surveyor.php
          node --check scripts/build-dev-preview.mjs
          node scripts/test-offline-integrity.mjs
          node scripts/test-picket-calculator.mjs
          node scripts/test-owner-materials.mjs
          php -l timeweb/backend/surveyor.php
          node scripts/test-canopy-calculator.mjs
          node scripts/test-surveyor-integrity.mjs
          node scripts/test-plan-auto-divide.mjs
          node --check dev-sync/server.mjs
          node --test dev-sync/test.mjs
          npm run build
          node scripts/build-timeweb.mjs
          test -s timeweb-dist/index.html
          test -s timeweb-dist/site.css
          test -s timeweb-dist/site.bundle.js
          test -s timeweb-dist/calculator.bundle.js
          test -s timeweb-dist/evroshtaketnik/index.html
          test -s timeweb-dist/evroshtaketnik/engine.js
          test -s timeweb-dist/evroshtaketnik/evroshtaketnik.js
          test -s timeweb-dist/naves/index.html
          test -s timeweb-dist/naves/admin.html
          test -s timeweb-dist/admin-canopy.js
          test -s timeweb-dist/naves/naves.css
          test -s timeweb-dist/naves/geometry.js
          test -s timeweb-dist/naves/pricing.js
          test -s timeweb-dist/naves/canopy-three.js
          test -s timeweb-dist/naves/vendor/three.module.js
          test -s timeweb-dist/naves/vendor/OrbitControls.js
          test -s timeweb-dist/naves/drawing.js
          test -s timeweb-dist/naves/naves.js
          test -s timeweb-dist/naves/export.js
          test -s timeweb-dist/privacy.html
          test -s timeweb-dist/evroshtaketnik/assets/fence-double-real.webp
          test -s timeweb-dist/evroshtaketnik/assets/fence-single-real.webp
          test -s timeweb-dist/evroshtaketnik/assets/fence-horizontal-real.webp
          node - <<'NODE'
          const fs = require('fs');
          for (const name of ['fence-double-real.webp','fence-single-real.webp','fence-horizontal-real.webp']) {
            const b = fs.readFileSync('timeweb-dist/evroshtaketnik/assets/' + name);
            if (b.subarray(0,4).toString('ascii') !== 'RIFF' || b.subarray(8,12).toString('ascii') !== 'WEBP') {
              throw new Error(name + ' is not a valid WebP file');
            }
          }
          console.log('Fence card WebP files are valid');
          NODE

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for mobile UX test
        run: npx playwright install --with-deps chromium

      - name: Test base mobile UX
        shell: bash
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          FENCE: ${{ steps.scope.outputs.fence }}
          CANOPY: ${{ steps.scope.outputs.canopy }}
        run: |
          set -euo pipefail
          suites=(tests/surveyor-mobile.spec.js)
          if [[ "$MODE" == full || "$FENCE" == true ]]; then suites+=(tests/evroshtaketnik-mobile.spec.js); fi
          if [[ "$MODE" == full || "$CANOPY" == true ]]; then suites+=(tests/naves-mobile.spec.js); fi
          npx playwright test "${suites[@]}" --workers=2

      - name: Snapshot current production data
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/kuzdvor-live-catalog.json /tmp/kuzdvor-live-fence-prices.json
          curl -fsS --connect-timeout 4 --max-time 15 --retry 2 --retry-delay 2 \
            https://kuzdvor.tw1.ru/api/catalog-images \
            -o /tmp/kuzdvor-live-catalog.json
          curl -fsS --connect-timeout 4 --max-time 15 --retry 2 --retry-delay 2 \
            https://kuzdvor.tw1.ru/api/fence-prices \
            -o /tmp/kuzdvor-live-fence-prices.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/kuzdvor-live-catalog.json','utf8')); console.log('Live catalog snapshot OK')"
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/kuzdvor-live-fence-prices.json','utf8')); if(!x.fence) throw Error('Fence prices missing'); console.log('Live fence prices snapshot OK')"

      - name: Prepare protected dev preview
        env:
          DEV_SURVEYOR_API_URL: ${{ vars.DEV_SURVEYOR_API_URL }}
        run: node scripts/build-dev-preview.mjs

      # Keep role isolation, offline installation and changed calculator
      # integration mandatory. Playwright uses isolated browser contexts.
      - name: Test protected DEV app and changed calculators
        shell: bash
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          SLIDING: ${{ steps.scope.outputs.sliding }}
          FENCE: ${{ steps.scope.outputs.fence }}
          CANOPY: ${{ steps.scope.outputs.canopy }}
        run: |
          set -euo pipefail
          suites=(tests/dev-pwa.spec.js tests/surveyor-owner-dashboard.spec.js)
          if [[ "$MODE" == full ]]; then
            suites+=(tests/surveyor-3d.spec.js tests/surveyor-test-pwa.spec.js tests/surveyor-v2.spec.js tests/surveyor-persistent-session.spec.js)
          fi
          if [[ "$MODE" == full || "$SLIDING" == true ]]; then suites+=(tests/surveyor-sliding-gates.spec.js); fi
          npx playwright test "${suites[@]}" --workers=2
          if [[ "$MODE" == full || "$FENCE" == true || "$CANOPY" == true ]]; then
            npx playwright test tests/surveyor-dev-calculator-bridge.spec.js --grep-invert 'gate calculator result returns into the same survey card'
          fi

      - name: Diagnose gate quote transfer separately
        if: steps.scope.outputs.mode == 'full'
        continue-on-error: true
        run: npx playwright test tests/surveyor-dev-calculator-bridge.spec.js --grep 'gate calculator result returns into the same survey card'

      # Owner-authorized phone acceptance route. Keep all existing DEV pages;
      # publish only a synthetic, local-only copy from an explicitly pinned SHA.
      - name: Build and test isolated KD 2.0 phone preview
        shell: bash
        env:
          KD_V2_SOURCE_SHA: '3a6487ed0dbfd064cca29cb7deeafbadd7175594'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev
          git fetch --no-tags --depth=1 origin "$KD_V2_SOURCE_SHA"
          preview="$RUNNER_TEMP/kd-v2-phone-src"
          mkdir -p "$preview"
          git archive "$KD_V2_SOURCE_SHA" surveyor-app scripts/build-kd-v2-phone.mjs tests/surveyor-v2-phone.spec.js | tar -x -C "$preview"
          node "$preview/scripts/build-kd-v2-phone.mjs" "$preview/surveyor-app" _site
          test -s _site/kd-v2/index.html
          grep -Fq "const DB_NAME = 'kd-v2-phone-demo-v1';" _site/kd-v2/app.js
          grep -Fq 'const API_ENABLED = false;' _site/kd-v2/app.js
          grep -Fq 'connect-src' _site/kd-v2/index.html
          cp "$preview/tests/surveyor-v2-phone.spec.js" tests/surveyor-v2-phone.spec.js
          npx playwright test tests/surveyor-v2-phone.spec.js --workers=1
          echo '### KD 2.0 phone preview: /kd-v2/ (synthetic local data only)' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify dev mirrors production frontend
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'noindex,nofollow,noarchive' _site/index.html
          grep -Fq 'kuzdvor-dev-gate' _site/index.html
          grep -Fq '/kuznechny-dvorik-gates/site.css' _site/index.html
          grep -Fq '/kuznechny-dvorik-gates/site.bundle.js' _site/index.html
          grep -Fq 'window.SITE_SETTINGS' _site/index.html
          grep -Fq 'Disallow: /' _site/robots.txt
          test -s _site/calculator.bundle.js
          test -s _site/catalog-enhancements.bundle.js
          test -s _site/api/catalog-images
          test -s _site/api/fence-prices
          test -s _site/api/offline-version
          test -s _site/surveyor-app/index.html
          test -s _site/surveyor-app/app.js
          test -s _site/surveyor-app/line-builder.js
          test -s _site/surveyor-app/sw.js
          test -s _site/surveyor-test/index.html
          test -s _site/surveyor-test/manifest.webmanifest
          test -s _site/surveyor-test/sw.js
          test -s _site/zamer-app-v2/index.html
          test -s _site/zamer-app-v2/manifest.webmanifest
          test -s _site/zamer-app-v2/sw.js
          test -s _site/zamer-app-v2/icon-192.png
          test -s _site/zamer-app-v2/icon-512.png
          test -s _site/dev-tools/index.html
          test -s _site/dev-tools/manifest.webmanifest
          test -s _site/dev-tools/sw.js
          test -s _site/surveyor-bridge.js
          node -e "const x=JSON.parse(require('fs').readFileSync('_site/api/offline-version','utf8')); if(!x.version || !String(x.version).startsWith('dev-')) throw Error('DEV offline version missing'); console.log('DEV offline version OK:', x.version)"
          if grep -Fq '<script src="app.js"' _site/index.html; then
            echo 'Dev preview is still using raw source scripts' >&2
            exit 1
          fi
          if grep -Rq 'KD-Dev-9Q7M-4X2P' _site; then
            echo 'Plain-text dev password leaked into published files' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload protected dev artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy protected dev site
        id: deployment
        uses: actions/deploy-pages@v4
