name: Deploy test site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check gate-page-ui.js
          node --check shared/customer-context.js
          node --check shared/delivery.js
          node --check shared/leads.js
          node --check public-site-settings.js
          node --check admin.js
          node --check admin-prices.js
          node --check admin-site.js
          node --check admin-leads.js
          node --check worker/runtime.js
          node --check worker/auth-d1.js
          node --check worker/site-settings-d1.js
          node --check worker/gate-quote-d1.js
          node --check worker/lead-antispam.js
          node --check worker/catalog-media-d1.js
          node --check worker/leads-d1.js
          node --check scripts/build.mjs
          node --check scripts/test-catalog-images.mjs
          node --check scripts/check-production.mjs

      - name: Verify catalog images
        run: node scripts/test-catalog-images.mjs

      - name: Verify gate page foundation
        run: node scripts/test-gate-page.mjs

      - name: Verify gate calculator
        run: node scripts/test-gate-calculator.mjs

      - name: Verify server gate quote
        run: node scripts/test-server-gate-quote.mjs

      - name: Verify production build
        run: npm run build

      - name: Check built Worker syntax
        run: node --check dist/server/index.js

      - name: Install browser tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Smoke check production endpoint
        continue-on-error: true
        run: node scripts/check-production.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static test build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/catalog _site/shared _site/napravleniya

          cp index.html styles.css storefront.css gate-page.css app.js public-site-settings.js gate-page-ui.js prices.js catalog-images.js _site/
          cp gate-calc-prices.js gate-calc-models-chunk1.js gate-calc-models-chunk2.js gate-calc-models-chunk3.js gate-calc-models-chunk4.js gate-calc-models.js gate-calc-engine.js _site/
          cp shared/customer-context.js shared/delivery.js shared/leads.js _site/shared/
          cp assets/hero-gates.jpg _site/hero-gates.jpg
          cp -R assets/catalog/. _site/catalog/
          cp delivery-prices.json _site/delivery-prices.json

          cp home.html home.css product-categories.js _site/napravleniya/
          cp admin.html admin.css admin.js admin-prices.js admin-site.js admin-leads.js _site/
          touch _site/.nojekyll

          node <<'NODE'
          const fs = require('fs');
          const delivery = fs.readFileSync('delivery-prices.json', 'utf8').trim();

          let html = fs.readFileSync('_site/index.html', 'utf8');
          html = html.replace('<script id="deliveryData" type="application/json">{}</script>', `<script id="deliveryData" type="application/json">${delivery.replace(/</g,'\\u003c')}</script>`);
          html = html.replaceAll('/hero-gates.jpg', 'hero-gates.jpg');
          html = html.replaceAll('/catalog/', 'catalog/');
          fs.writeFileSync('_site/index.html', html);

          let galleries = fs.readFileSync('_site/catalog-images.js', 'utf8');
          galleries = galleries.replaceAll('/catalog/', 'catalog/');
          fs.writeFileSync('_site/catalog-images.js', galleries);

          let app = fs.readFileSync('_site/app.js', 'utf8');
          app = app.replaceAll('/hero-gates.jpg', 'hero-gates.jpg');
          app = app.replaceAll("fetch('/api/", "fetch('api/");
          app = app.replaceAll('fetch(`/api/', 'fetch(`api/');
          fs.writeFileSync('_site/app.js', app);

          let home = fs.readFileSync('_site/napravleniya/home.html', 'utf8');
          home = home.replace('__RUNTIME_SITE_DATA__', '{}');
          home = home.replace('href="/napravleniya"', 'href="./"');
          home = home.replaceAll('href="/vorota"', 'href="../"');
          fs.writeFileSync('_site/napravleniya/index.html', home);
          fs.unlinkSync('_site/napravleniya/home.html');

          let categories = fs.readFileSync('_site/napravleniya/product-categories.js', 'utf8');
          categories = categories.replace("href: '/vorota'", "href: '../'");
          fs.writeFileSync('_site/napravleniya/product-categories.js', categories);

          let admin = fs.readFileSync('_site/admin.html', 'utf8');
          admin = admin.replaceAll('href="/"', 'href="./"');
          fs.writeFileSync('_site/admin.html', admin);

          for (const file of ['admin.js','admin-prices.js','admin-site.js','admin-leads.js']) {
            let js = fs.readFileSync(`_site/${file}`, 'utf8');
            js = js.replaceAll("'/api/", "'api/");
            js = js.replaceAll('"/api/', '"api/');
            fs.writeFileSync(`_site/${file}`, js);
          }
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
