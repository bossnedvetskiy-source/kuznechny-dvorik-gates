name: Deploy protected dev site

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dev-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Normalize XLSX browser bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s node_modules/xlsx/dist/xlsx.full.min.js ]; then
            test -s node_modules/xlsx/xlsx.js
            mkdir -p node_modules/xlsx/dist
            cp node_modules/xlsx/xlsx.js node_modules/xlsx/dist/xlsx.full.min.js
          fi

      - name: Build exact Timeweb frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check dev-access.js
          node --check evroshtaketnik/engine.js
          node --check evroshtaketnik/evroshtaketnik.js
          node --check admin-prices.js
          node --check site-sw.js
          node --check worker/site-settings-d1.js
          php -l timeweb/local-api.php
          node --check scripts/build-dev-preview.mjs
          node scripts/test-picket-calculator.mjs
          npm run build
          node scripts/build-timeweb.mjs
          test -s timeweb-dist/index.html
          test -s timeweb-dist/site.css
          test -s timeweb-dist/site.bundle.js
          test -s timeweb-dist/calculator.bundle.js
          test -s timeweb-dist/evroshtaketnik/index.html
          test -s timeweb-dist/evroshtaketnik/engine.js
          test -s timeweb-dist/evroshtaketnik/evroshtaketnik.js
          test -s timeweb-dist/privacy.html
          test -s timeweb-dist/evroshtaketnik/assets/fence-double-real.webp
          test -s timeweb-dist/evroshtaketnik/assets/fence-single-real.webp
          test -s timeweb-dist/evroshtaketnik/assets/fence-horizontal-real.webp
          node - <<'NODE'
          const fs = require('fs');
          for (const name of ['fence-double-real.webp','fence-single-real.webp','fence-horizontal-real.webp']) {
            const b = fs.readFileSync('timeweb-dist/evroshtaketnik/assets/' + name);
            if (b.subarray(0,4).toString('ascii') !== 'RIFF' || b.subarray(8,12).toString('ascii') !== 'WEBP') {
              throw new Error(name + ' is not a valid WebP file');
            }
          }
          console.log('Fence card WebP files are valid');
          NODE

      - name: Install Chromium for mobile UX test
        run: npx playwright install --with-deps chromium

      - name: Test euro picket mobile UX
        run: npx playwright test tests/evroshtaketnik-mobile.spec.js

      - name: Snapshot current production data
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/kuzdvor-live-catalog.json /tmp/kuzdvor-live-fence-prices.json
          curl -fsS --connect-timeout 4 --max-time 15 --retry 2 --retry-delay 2 \
            https://kuzdvor.tw1.ru/api/catalog-images \
            -o /tmp/kuzdvor-live-catalog.json
          curl -fsS --connect-timeout 4 --max-time 15 --retry 2 --retry-delay 2 \
            https://kuzdvor.tw1.ru/api/fence-prices \
            -o /tmp/kuzdvor-live-fence-prices.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/kuzdvor-live-catalog.json','utf8')); console.log('Live catalog snapshot OK')"
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/kuzdvor-live-fence-prices.json','utf8')); if(!x.fence) throw Error('Fence prices missing'); console.log('Live fence prices snapshot OK')"

      - name: Prepare protected dev preview
        run: node scripts/build-dev-preview.mjs

      - name: Verify dev mirrors production frontend
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'noindex,nofollow,noarchive' _site/index.html
          grep -Fq 'kuzdvor-dev-gate' _site/index.html
          grep -Fq '/kuznechny-dvorik-gates/site.css' _site/index.html
          grep -Fq '/kuznechny-dvorik-gates/site.bundle.js' _site/index.html
          grep -Fq 'window.SITE_SETTINGS' _site/index.html
          grep -Fq 'Disallow: /' _site/robots.txt
          test -s _site/calculator.bundle.js
          test -s _site/catalog-enhancements.bundle.js
          test -s _site/api/catalog-images
          test -s _site/api/fence-prices
          if grep -Fq '<script src="app.js"' _site/index.html; then
            echo 'Dev preview is still using raw source scripts' >&2
            exit 1
          fi
          if grep -Rq 'KD-Dev-9Q7M-4X2P' _site; then
            echo 'Plain-text dev password leaked into published files' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload protected dev artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy protected dev site
        id: deployment
        uses: actions/deploy-pages@v4
