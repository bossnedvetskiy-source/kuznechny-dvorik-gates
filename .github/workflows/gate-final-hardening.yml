name: Gate final hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply hardening patch
        run: python3 .github/gate-final-hardening.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check gate-page-ui.js
          node --check admin-leads.js
          node --check worker/leads-d1.js
      - name: Verify gate page foundation
        run: node scripts/test-gate-page.mjs
      - name: Verify Excel gate calculator
        run: node scripts/test-gate-calculator.mjs
      - name: Build production worker
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js gate-page-ui.js gate-page.css scripts/test-gate-calculator.mjs scripts/test-gate-page.mjs worker/leads-d1.js admin-leads.js ENVIRONMENT-EXAMPLE.txt
          if git diff --cached --quiet; then
            echo "No hardening changes"
            exit 0
          fi
          git commit -m "Harden gate lead flow and notifications"
          git push
