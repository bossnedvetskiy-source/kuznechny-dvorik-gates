name: Performance branch check

on:
  push:
    branches:
      - perf/mobile-second-pass
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Check syntax
        run: |
          node --check worker/site-settings-d1.js
          node --check worker/excel-pricing-d1.js
          node --check worker/runtime.js
          node --check scripts/build.mjs
      - name: Verify gate page foundation
        run: node scripts/test-gate-page.mjs
      - name: Verify gate calculator
        run: node scripts/test-gate-calculator.mjs
      - name: Verify server gate quote
        run: node scripts/test-server-gate-quote.mjs
      - name: Build production Worker
        run: npm run build
      - name: Check built output
        run: |
          node --check dist/server/index.js
          node --check dist/client/site.bundle.js
          test -s dist/client/site.css
          test -s dist/client/site.bundle.js
      - name: Report build size
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          for (const file of ['dist/server/index.js','dist/client/site.css','dist/client/site.bundle.js']) {
            const body = fs.readFileSync(file);
            console.log(`${file}: ${body.length} bytes; gzip ${zlib.gzipSync(body).length} bytes`);
          }
          const worker = fs.readFileSync('dist/server/index.js','utf8');
          if (!worker.includes('/site.css') || !worker.includes('/site.bundle.js')) throw new Error('Public page does not reference external performance assets');
          if (!worker.includes('window.GATE_CALC_PRICES=__RUNTIME_GATE_CALC_PRICES__')) throw new Error('Runtime Excel prices are not injected into public page');
          const pageMatch = worker.match(/^const PAGE = ("(?:\\.|[^"\\])*");/m);
          if (!pageMatch) throw new Error('Could not extract built public HTML template');
          const page = JSON.parse(pageMatch[1]);
          console.log(`Public HTML template: ${Buffer.byteLength(page)} bytes; gzip ${zlib.gzipSync(Buffer.from(page)).length} bytes`);
          NODE
      - name: Measure current production reads
        run: |
          node <<'NODE'
          const { performance } = require('perf_hooks');
          const base = 'https://kuznechny-dvorik-gates.boss-nedvetskiy.workers.dev';
          async function timed(path) {
            const start = performance.now();
            const response = await fetch(base + path, {cache:'no-store', headers:{'user-agent':'kuzdvor-perf-check/1.0'}});
            const text = await response.text();
            const ms = Math.round(performance.now() - start);
            console.log(`${path}: HTTP ${response.status}; ${ms} ms; ${Buffer.byteLength(text)} bytes`);
            return {response,text,ms};
          }
          (async()=>{
            await timed('/?perf=1');
            await timed('/?perf=2');
            const gallery = await timed('/api/catalog-images?perf=1');
            try {
              const data = JSON.parse(gallery.text);
              const galleries = Object.values(data.galleries || {});
              const photos = galleries.flatMap(item => Array.isArray(item?.photos) ? item.photos : []);
              const custom = photos.filter(url => String(url).startsWith('/catalog-media/'));
              console.log(`Catalog galleries: ${galleries.length}; photos ${photos.length}; custom D1/R2 media ${custom.length}`);
            } catch (error) {
              console.log('Catalog JSON parse failed:', error.message);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Install Chromium for production browser diagnostics
        run: npx playwright install --with-deps chromium
      - name: Run production in a real mobile browser
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base = 'https://kuznechny-dvorik-gates.boss-nedvetskiy.workers.dev/?browser_diag=1';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844}, deviceScaleFactor:1, isMobile:true, hasTouch:true});
          const pageErrors=[];
          const consoleErrors=[];
          const failed=[];
          page.on('pageerror', err => pageErrors.push(String(err?.stack || err)));
          page.on('console', msg => { if (msg.type()==='error') consoleErrors.push(msg.text()); });
          page.on('requestfailed', req => failed.push(`${req.resourceType()} ${req.url()} :: ${req.failure()?.errorText || 'failed'}`));
          const response = await page.goto(base,{waitUntil:'domcontentloaded',timeout:30000});
          console.log('Main response:', response?.status());
          await page.waitForTimeout(5000);
          const state = await page.evaluate(() => ({
            ready: document.readyState,
            title: document.title,
            bodyText: document.body?.innerText?.slice(0,1000) || '',
            cards: document.querySelectorAll('#catalogGrid .product-card').length,
            catalogGridExists: !!document.querySelector('#catalogGrid'),
            catalogCount: document.querySelector('#catalogCount')?.textContent || '',
            showMore: document.querySelector('#showMoreButton')?.textContent || '',
            heroInstalled: document.querySelector('#heroInstalledPrice')?.textContent || '',
            bundleScripts: [...document.scripts].map(s=>s.src).filter(Boolean),
            cssLinks: [...document.querySelectorAll('link[rel="stylesheet"]')].map(l=>l.href),
            images: [...document.images].slice(0,12).map(img=>({src:img.currentSrc||img.src,complete:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight}))
          }));
          console.log('STATE', JSON.stringify(state,null,2));
          console.log('PAGE_ERRORS', JSON.stringify(pageErrors,null,2));
          console.log('CONSOLE_ERRORS', JSON.stringify(consoleErrors,null,2));
          console.log('FAILED_REQUESTS', JSON.stringify(failed.slice(0,40),null,2));
          if (!response?.ok()) throw new Error(`Main page HTTP ${response?.status()}`);
          if (!state.catalogGridExists) throw new Error('catalogGrid is missing from DOM');
          if (state.cards < 1) throw new Error('Catalog did not render any product cards');
          if (!state.heroInstalled) throw new Error('Hero price did not initialize');
          if (pageErrors.length) throw new Error(`Browser page errors: ${pageErrors.join(' | ')}`);
          await browser.close();
          NODE
