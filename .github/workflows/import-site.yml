name: Import full site source

on:
  push:
    paths:
      - 'kuznechny-dvorik-gallery-fixed.zip'
      - 'kuznechny-dvorik-full-site.zip'
      - 'site-source.zip'
      - '.github/workflows/import-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract site archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP=''
          if [ -f 'kuznechny-dvorik-gallery-fixed.zip' ]; then
            ZIP='kuznechny-dvorik-gallery-fixed.zip'
          elif [ -f 'kuznechny-dvorik-full-site.zip' ]; then
            ZIP='kuznechny-dvorik-full-site.zip'
          elif [ -f 'site-source.zip' ]; then
            ZIP='site-source.zip'
          else
            echo 'No supported site ZIP found.'
            exit 1
          fi

          rm -rf /tmp/site-import
          mkdir -p /tmp/site-import
          unzip -q "$ZIP" -d /tmp/site-import

          if [ -d '/tmp/site-import/site-export/source' ]; then
            SOURCE='/tmp/site-import/site-export/source'
          else
            SOURCE=$(find /tmp/site-import -maxdepth 4 -type d -name source | head -n 1 || true)
          fi

          if [ -z "${SOURCE:-}" ] || [ ! -d "$SOURCE" ]; then
            echo 'Site source folder was not found in ZIP.'
            find /tmp/site-import -maxdepth 3 -type d -print
            exit 1
          fi

          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'README.md' \
            "$SOURCE/" ./

          rm -f 'kuznechny-dvorik-gallery-fixed.zip' 'kuznechny-dvorik-full-site.zip' 'site-source.zip'

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import full Kuznechny Dvorik site source [skip ci]'
          git push
