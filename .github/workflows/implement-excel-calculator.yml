name: Implement Excel gate calculator

on:
  push:
    paths:
      - '.github/workflows/implement-excel-calculator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Integrate exact dimension calculator
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, *, required=True):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  if required: raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
                  return False
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              return True

          # Add Art.39 and Art.40 to the existing catalog price architecture.
          p=Path('prices.js'); s=p.read_text(encoding='utf-8')
          if "{ art: 'Арт.39', price: 64100 }" not in s:
              s=s.replace("    { art: 'Арт.18', price: 59800 },\n    { art: 'Арт.31', price: 65200 },",
                          "    { art: 'Арт.18', price: 59800 },\n    { art: 'Арт.39', price: 64100 },\n    { art: 'Арт.31', price: 65200 },\n    { art: 'Арт.40', price: 67700 },",1)
          p.write_text(s,encoding='utf-8')

          # Existing UI: only add the missing wicket-height input and calc runtime scripts.
          replace('index.html',
          '''              <label>Высота, м<input id="heightInput" type="number" min="1" max="3" step="0.1" value="1.8" inputmode="decimal"></label>''',
          '''              <label>Высота ворот, м<input id="heightInput" type="number" min="1" max="3" step="0.1" value="1.8" inputmode="decimal"></label>\n              <label id="wicketHeightWrap">Высота калитки, м<input id="wicketHeightInput" type="number" min="1" max="3" step="0.1" value="1.8" inputmode="decimal"></label>''')
          replace('index.html','Нестандартный размер — расчёт ориентировочный','Цена пересчитана по выбранным размерам')
          replace('index.html','38 моделей','40 моделей',required=False)
          replace('index.html','Показано 6 из 38','Показано 6 из 40',required=False)
          replace('index.html',
          '''  <script src="prices.js"></script>\n  <script src="app.js"></script>''',
          '''  <script src="prices.js"></script>\n  <script src="gate-calc-prices.js"></script>\n  <script src="gate-calc-models-chunk1.js"></script>\n  <script src="gate-calc-models-chunk2.js"></script>\n  <script src="gate-calc-models-chunk3.js"></script>\n  <script src="gate-calc-models-chunk4.js"></script>\n  <script src="gate-calc-models.js"></script>\n  <script src="gate-calc-engine.js"></script>\n  <script src="app.js"></script>''')

          # Existing catalog product structure: extend, don't fork it.
          replace('app.js',
          '''    price,install:priceData.catalogInstallation,posts:priceData.catalogPosts,standard:[3.4,1.8],wicketWidth:1,''',
          '''    price,install:priceData.catalogInstallation,posts:priceData.catalogPosts,standard:[3.4,1.8],wicketWidth:1,wicketHeight:1.8,''')
          replace('app.js',
          '''const heightInput=document.getElementById('heightInput');''',
          '''const heightInput=document.getElementById('heightInput');\nconst wicketHeightInput=document.getElementById('wicketHeightInput');\nconst wicketHeightWrap=document.getElementById('wicketHeightWrap');''')
          replace('app.js',
          '''  widthInput.value=product.standard[0];heightInput.value=product.standard[1];\n  wicketWidthInput.value=product.wicketWidth??1;''',
          '''  widthInput.value=product.standard[0];heightInput.value=product.standard[1];\n  wicketWidthInput.value=product.wicketWidth??1;\n  if(wicketHeightInput) wicketHeightInput.value=product.wicketHeight??product.standard[1];''')
          replace('app.js',
          '''  wicketWidthWrap.hidden=!hasSeparateWicket;''',
          '''  wicketWidthWrap.hidden=!hasSeparateWicket;\n  if(wicketHeightWrap) wicketHeightWrap.hidden=!hasSeparateWicket;''')

          replace('app.js',
          '''function isNonStandard(product){\n  const gateWidthChanged=Math.abs((Number(widthInput.value)||0)-product.standard[0])>.01;\n  const heightChanged=Math.abs((Number(heightInput.value)||0)-product.standard[1])>.01;\n  const wicketWidthChanged=Number.isFinite(product.wicketWidth)&&Math.abs((Number(wicketWidthInput.value)||0)-product.wicketWidth)>.01;\n  return gateWidthChanged||heightChanged||wicketWidthChanged;\n}''',
          '''function isNonStandard(product){\n  const gateWidthChanged=Math.abs((Number(widthInput.value)||0)-product.standard[0])>.01;\n  const gateHeightChanged=Math.abs((Number(heightInput.value)||0)-product.standard[1])>.01;\n  const wicketWidthChanged=Number.isFinite(product.wicketWidth)&&Math.abs((Number(wicketWidthInput.value)||0)-product.wicketWidth)>.01;\n  const wicketHeightChanged=Number.isFinite(product.wicketWidth)&&Math.abs((Number(wicketHeightInput?.value)||0)-(product.wicketHeight??product.standard[1]))>.01;\n  return gateWidthChanged||gateHeightChanged||wicketWidthChanged||wicketHeightChanged;\n}''')

          replace('app.js',
          '''  if(Number.isFinite(product.wicketWidth)) return [`Размер ворот: ${widthInput.value} × ${heightInput.value} м`,`Размер калитки: ${wicketWidthInput.value} × ${heightInput.value} м`];''',
          '''  if(Number.isFinite(product.wicketWidth)) return [`Размер ворот: ${widthInput.value} × ${heightInput.value} м`,`Размер калитки: ${wicketWidthInput.value} × ${wicketHeightInput?.value||heightInput.value} м`];''')

          replace('app.js',
          '''function calcData(){\n  const product=selectedProduct(),lines=[['Изделие',product.price]];''',
          '''function catalogCalculatedPrice(product){\n  if(product.type!=='catalog'||!window.GATE_CALC?.hasArticle(product.art)) return product.price;\n  try{\n    return window.GATE_CALC.calculateGate({\n      article:product.art,\n      gateWidth:Number(widthInput.value),\n      gateHeight:Number(heightInput.value),\n      wicketWidth:Number(wicketWidthInput.value),\n      wicketHeight:Number(wicketHeightInput?.value||heightInput.value)\n    }).total;\n  }catch(error){\n    console.error('Gate calculation failed',product.art,error);\n    return product.price;\n  }\n}\n\nfunction calcData(){\n  const product=selectedProduct(),lines=[['Изделие',catalogCalculatedPrice(product)]];''')

          replace('app.js',
          '''  const approximate=nonStandard||p.from||deliveryPending;\n  sizeNotice.hidden=!nonStandard;''',
          '''  const dimensionsCalculated=p.type==='catalog'&&Boolean(window.GATE_CALC?.hasArticle(p.art));\n  const approximate=(nonStandard&&!dimensionsCalculated)||p.from||deliveryPending;\n  sizeNotice.hidden=!nonStandard||!dimensionsCalculated;''')
          replace('app.js',
          '''  if(nonStandard) note='Размер отличается от стандартного. Показана цена стандартной модели — точную стоимость подтвердим после замера. Доставка учтена в общей сумме.';''',
          '''  if(nonStandard&&dimensionsCalculated) note='Стоимость изделия пересчитана по указанным размерам и формуле выбранной модели. Доставка учтена в общей сумме. Итоговую стоимость зафиксируем после замера.';\n  else if(nonStandard) note='Размер отличается от стандартного. Точную стоимость подтвердим после замера. Доставка учтена в общей сумме.';''')

          replace('app.js',
          '''    wicketWidth:Number.isFinite(p.wicketWidth)?(Number(wicketWidthInput.value)||null):null,\n    height:Number(heightInput.value)||null,''',
          '''    wicketWidth:Number.isFinite(p.wicketWidth)?(Number(wicketWidthInput.value)||null):null,\n    wicketHeight:Number.isFinite(p.wicketWidth)?(Number(wicketHeightInput?.value)||null):null,\n    height:Number(heightInput.value)||null,''')

          # Recalculate on wicket-height changes and once the async formula pack is ready.
          marker="if(mobileCatalogMedia.matches) estimateBreakdown.open=false;"
          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          if 'wicketHeightInput?.addEventListener' not in s:
              s=s.replace(marker, marker+"\nwicketHeightInput?.addEventListener('input',calculate);\nwicketHeightInput?.addEventListener('change',calculate);\nwindow.GATE_CALC?.ready?.then(()=>{ if(!calculatorPanel.hidden) calculate(); renderProducts(); }).catch(error=>console.error('Gate models load failed',error));",1)
          p.write_text(s,encoding='utf-8')

          # Worker build inlines the new runtime bundle so production remains self-contained.
          p=Path('scripts/build.mjs'); s=p.read_text(encoding='utf-8')
          anchor="const deliveryPrices = JSON.parse(deliveryPricesSource);"
          bundle="""const gateCalcSources = await Promise.all([\n  readFile('gate-calc-prices.js', 'utf8'),\n  readFile('gate-calc-models-chunk1.js', 'utf8'),\n  readFile('gate-calc-models-chunk2.js', 'utf8'),\n  readFile('gate-calc-models-chunk3.js', 'utf8'),\n  readFile('gate-calc-models-chunk4.js', 'utf8'),\n  readFile('gate-calc-models.js', 'utf8'),\n  readFile('gate-calc-engine.js', 'utf8')\n]);\nconst gateCalcBundle = gateCalcSources.join('\\n');\n\n"""
          if 'const gateCalcBundle =' not in s:
              if anchor not in s: raise SystemExit('build anchor missing')
              s=s.replace(anchor,bundle+anchor,1)
          old="""  .replace('<script src=\"prices.js\"></script>', '<script>window.PRICE_DATA=__RUNTIME_PRICE_DATA__;window.SITE_SETTINGS=__RUNTIME_SITE_DATA__;</script>')\n  .replace('<script src=\"app.js\"></script>', `<script>${publicJs}</script><script>${publicSiteJsSource}</script>`);"""
          new="""  .replace('<script src=\"prices.js\"></script>', '<script>window.PRICE_DATA=__RUNTIME_PRICE_DATA__;window.SITE_SETTINGS=__RUNTIME_SITE_DATA__;</script>')\n  .replace('<script src=\"gate-calc-prices.js\"></script>', `<script>${gateCalcBundle}</script>`)\n  .replace('<script src=\"gate-calc-models-chunk1.js\"></script>', '')\n  .replace('<script src=\"gate-calc-models-chunk2.js\"></script>', '')\n  .replace('<script src=\"gate-calc-models-chunk3.js\"></script>', '')\n  .replace('<script src=\"gate-calc-models-chunk4.js\"></script>', '')\n  .replace('<script src=\"gate-calc-models.js\"></script>', '')\n  .replace('<script src=\"gate-calc-engine.js\"></script>', '')\n  .replace('<script src=\"app.js\"></script>', `<script>${publicJs}</script><script>${publicSiteJsSource}</script>`);"""
          if old not in s: raise SystemExit('build html replacement block missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

      - name: Build project
        run: npm run build

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prices.js index.html app.js scripts/build.mjs
          if git diff --cached --quiet; then
            echo 'No integration changes.'
            exit 0
          fi
          git commit -m 'Integrate exact Excel dimension calculator [skip ci]'
          git push origin main
