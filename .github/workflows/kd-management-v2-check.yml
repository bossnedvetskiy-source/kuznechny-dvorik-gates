name: KD Management v2 isolated regression

on:
  push:
    branches: [feature/kd-management-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kd-management-v2-${{ contains(github.event.head_commit.message, '[v2-focused]') && 'focused' || 'full' }}
  cancel-in-progress: true

jobs:
  baseline:
    if: github.ref == 'refs/heads/feature/kd-management-v2'
    # Playwright 1.55 does not support ubuntu26.04-x64.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEV_SURVEYOR_API_URL: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Normalize local browser assets
        run: |
          if [ ! -s node_modules/xlsx/dist/xlsx.full.min.js ]; then
            mkdir -p node_modules/xlsx/dist
            cp node_modules/xlsx/xlsx.js node_modules/xlsx/dist/xlsx.full.min.js
          fi
      - name: Run existing calculation and geometry references
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for test in gate-calculator picket-calculator canopy-calculator owner-materials surveyor-3d-geometry surveyor-3d-layout surveyor-3d-product surveyor-3d-sliding plan-auto-divide surveyor-integrity offline-integrity kd-private-pricing; do
            echo "::group::$test"
            node "scripts/test-$test.mjs" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Check backend syntax
        if: success() || failure()
        run: php -l timeweb/backend/surveyor.php
      - name: Build isolated preview from repository data only
        id: preview
        if: success() || failure()
        run: |
          set -euo pipefail
          rm -f /tmp/kuzdvor-live-catalog.json /tmp/kuzdvor-live-fence-prices.json
          npm run build
          node scripts/build-timeweb.mjs
          node scripts/build-dev-preview.mjs
          KD_V2_SOURCE_SHA="$GITHUB_SHA" node scripts/build-kd-v2-phone.mjs surveyor-app _site
          test -s _site/kd-v2/index.html
          test -s _site/dev-tools/index.html
          test -s _site/surveyor-test/index.html
      - name: Verify PHP article quote against all model references
        if: (success() || failure()) && steps.preview.outcome == 'success'
        run: php scripts/test-timeweb-gate-quote.php timeweb-dist
      - name: Verify frontend-only preview isolation
        id: isolation
        if: (success() || failure()) && steps.preview.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$DEV_SURVEYOR_API_URL"
          test ! -e _site/scripts/kd-private-pricing.mjs
          test ! -e _site/scripts/kd-private-serial-frame.mjs
          test ! -e _site/scripts/kd-private-canopy.mjs
          test ! -e _site/scripts/kd-private-fences.mjs
          test ! -e _site/backend
          test ! -e _site/local-api.php
          for dir in dev-tools dev-tools-v4 surveyor-test; do
            test -s "_site/$dir/index.html"
            if grep -F 'window.KD_DEV_SURVEYOR_API=' "_site/$dir/index.html"; then
              echo "::error::Unexpected staging API injection in $dir"
              exit 1
            fi
          done
          printf '%s\n' "$GITHUB_SHA" > _site/KD-V2-BUILD-SHA.txt
          cat > _site/KD-V2-LOCAL-README.txt <<'EOF'
          Test build only. Do not deploy to production or enter real client data.
          Extract this artifact into a folder named kuznechny-dvorik-gates.
          In its parent directory run: python -m http.server 4173 --bind 127.0.0.1
          New interface: http://127.0.0.1:4173/kuznechny-dvorik-gates/surveyor-test/?ui=v2
          Old interface: http://127.0.0.1:4173/kuznechny-dvorik-gates/surveyor-test/?ui=legacy
          Standalone design preview: http://127.0.0.1:4173/kuznechny-dvorik-gates/surveyor-app/v2-shell-preview.html
          Local test login: admin / 1234 or zamer / 1234.
          Use a separate browser profile; the test does not sync to the business database.
          EOF
      - name: Store isolated static preview (no deployment)
        if: (success() || failure()) && steps.isolation.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kd-management-v2-preview
          path: _site/
          if-no-files-found: error
          retention-days: 5
          compression-level: 1
      - name: Cache Playwright Chromium
        if: (success() || failure()) && steps.isolation.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        id: chromium
        if: (success() || failure()) && steps.isolation.outcome == 'success'
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Chromium setup failed (attempt $attempt)"
            if [[ "$attempt" -lt 3 ]]; then sleep 10; fi
          done
          exit 1
      - name: Verify new shell prototype separately
        if: (success() || failure()) && steps.chromium.outcome == 'success'
        run: npx playwright test tests/surveyor-v2-shell-preview.spec.js --workers=1
      - name: Verify local authenticated v2 home separately
        if: (success() || failure()) && steps.chromium.outcome == 'success'
        run: npx playwright test tests/surveyor-v2-home-integration.spec.js --workers=1
      - name: Verify isolated phone copy
        if: (success() || failure()) && steps.chromium.outcome == 'success'
        run: npx playwright test tests/surveyor-v2-phone.spec.js --workers=1
      - name: Run mobile, offline, roles and all surveyor browser tests
        if: (success() || failure()) && steps.chromium.outcome == 'success' && !contains(github.event.head_commit.message, '[v2-focused]')
        run: npx playwright test tests/surveyor-*.spec.js tests/dev-pwa.spec.js --workers=2
      - name: Save failure traces and local test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kd-management-v2-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 5
