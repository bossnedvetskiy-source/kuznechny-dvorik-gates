name: Enrich offline settlement addresses

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-offline-delivery-addresses.mjs'
      - '.github/workflows/enrich-offline-delivery-addresses.yml'

permissions:
  contents: write
  actions: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enrich district and region for offline settlements
        run: node scripts/enrich-offline-delivery-addresses.mjs

      - name: Verify address labels
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('offline-delivery-200km.json','utf8'));
          const rows=Array.isArray(data.destinations)?data.destinations:[];
          if(rows.length<1000)throw new Error('Offline settlement list is unexpectedly small');
          const typed=rows.filter(x=>/(?:село\s*\/\s*деревня|деревня\s*\/\s*хутор|город\s*\/\s*пос[её]лок)/iu.test(String(x.secondary||'')));
          if(typed.length)throw new Error('Settlement type leaked into secondary address: '+typed[0].name);
          const sample=rows.find(x=>String(x.name||'').toLocaleLowerCase('ru-RU')==='старомурапталово');
          if(!sample)throw new Error('Старомурапталово missing');
          if(!/(?:район|округ)/iu.test(String(sample.secondary||'')))throw new Error('Старомурапталово still has no district: '+sample.secondary);
          console.log('Старомурапталово:',sample);
          console.log('Address enrichment meta:',data.meta);
          NODE

      - name: Commit enriched snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- offline-delivery-200km.json; then
            echo 'No address changes'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline-delivery-200km.json
          git commit -m "Enrich offline settlement districts and regions"
          git push origin HEAD:main

      # Pushes made by GITHUB_TOKEN do not start other workflows automatically.
      # Explicitly rebuild production so the enriched offline snapshot reaches Timeweb.
      - name: Rebuild Timeweb with enriched addresses
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-timeweb-main.yml --ref main
