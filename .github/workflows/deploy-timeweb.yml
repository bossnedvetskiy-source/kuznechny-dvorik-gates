name: Build Timeweb test site

on:
  push:
    branches: [timeweb-migration]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timeweb-test-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install build dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build current site
        run: npm run build

      - name: Prepare Timeweb package
        run: node scripts/build-timeweb.mjs

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          test -s timeweb-dist/index.html
          test -s timeweb-dist/admin.html
          test -s timeweb-dist/site.css
          test -s timeweb-dist/site.bundle.js
          test -s timeweb-dist/api-proxy.php
          test -s timeweb-dist/local-api.php
          test -s timeweb-dist/backend/bootstrap.php
          test -s timeweb-dist/backend/schema.mysql.sql
          test -s timeweb-dist/backend/defaults.json
          test -s timeweb-dist/setup-timeweb.php
          test -s timeweb-dist/migrate-from-cloudflare.php
          test -s timeweb-dist/.htaccess
          php -l timeweb-dist/local-api.php
          php -l timeweb-dist/backend/bootstrap.php
          php -l timeweb-dist/setup-timeweb.php
          php -l timeweb-dist/migrate-from-cloudflare.php
          echo "Prepared $(find timeweb-dist -type f | wc -l) files for Timeweb"

      - name: Publish generated files to timeweb-public branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/timeweb-dist
          cp -a timeweb-dist /tmp/timeweb-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan timeweb-public
          git rm -rf . || true
          git clean -fdx
          cp -a /tmp/timeweb-dist/. .
          git add -A
          git commit -m "Build Timeweb site from ${GITHUB_SHA}"
          git push --force origin HEAD:timeweb-public
