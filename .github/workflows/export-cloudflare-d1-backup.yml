name: Export Cloudflare D1 backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_MIGRATION_PASSWORD: ${{ secrets.CF_MIGRATION_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate migration password
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_MIGRATION_PASSWORD:-}" || { echo "Missing CF_MIGRATION_PASSWORD repository secret" >&2; exit 1; }
          if [ "${#CF_MIGRATION_PASSWORD}" -lt 10 ]; then
            echo "CF_MIGRATION_PASSWORD must be at least 10 characters" >&2
            exit 1
          fi

      - name: Export remote D1 database
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 export kuznechny-dvorik-gates-db --remote --output=/tmp/kuzdvor-d1.sql
          test -s /tmp/kuzdvor-d1.sql

      - name: Build safe inventory
        shell: bash
        run: |
          set -euo pipefail
          DB=/tmp/kuzdvor-d1.sqlite
          rm -f "$DB"
          sqlite3 "$DB" < /tmp/kuzdvor-d1.sql
          {
            echo "Cloudflare D1 inventory"
            echo "Generated: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            sqlite3 "$DB" "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name;" | while IFS= read -r table; do
              [ -n "$table" ] || continue
              count=$(sqlite3 "$DB" "SELECT COUNT(*) FROM \"$table\";")
              printf '%s: %s\n' "$table" "$count"
            done
          } > /tmp/d1-inventory.txt
          cat /tmp/d1-inventory.txt

      - name: Encrypt backup
        shell: bash
        run: |
          set -euo pipefail
          gzip -9 -c /tmp/kuzdvor-d1.sql > /tmp/kuzdvor-d1.sql.gz
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in /tmp/kuzdvor-d1.sql.gz \
            -out /tmp/kuzdvor-d1.sql.gz.enc \
            -pass env:CF_MIGRATION_PASSWORD
          sha256sum /tmp/kuzdvor-d1.sql.gz.enc > /tmp/kuzdvor-d1.sql.gz.enc.sha256
          rm -f /tmp/kuzdvor-d1.sql /tmp/kuzdvor-d1.sql.gz /tmp/kuzdvor-d1.sqlite

      - name: Upload encrypted migration backup
        uses: actions/upload-artifact@v4
        with:
          name: kuzdvor-d1-encrypted-backup
          path: |
            /tmp/kuzdvor-d1.sql.gz.enc
            /tmp/kuzdvor-d1.sql.gz.enc.sha256
            /tmp/d1-inventory.txt
          retention-days: 3
          if-no-files-found: error
