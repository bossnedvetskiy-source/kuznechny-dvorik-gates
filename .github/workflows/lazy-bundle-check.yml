name: Lazy public bundle check

on:
  push:
    branches:
      - perf/lazy-calculator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Check syntax
        run: |
          node --check public-lazy-runtime.js
          node --check worker/public-prices-runtime.js
          node --check worker/site-settings-d1.js
          node --check worker/excel-pricing-d1.js
          node --check worker/gate-quote-d1.js
          node --check scripts/build.mjs
      - name: Verify existing gate behavior
        run: |
          node scripts/test-gate-page.mjs
          node scripts/test-gate-calculator.mjs
          node scripts/test-server-gate-quote.mjs
          node scripts/test-catalog-images.mjs
          node scripts/test-color-photos.mjs
      - name: Build production Worker
        run: npm run build
      - name: Verify split bundles
        run: |
          node --check dist/server/index.js
          node --check dist/client/site.bundle.js
          node --check dist/client/calculator.bundle.js
          node --check dist/client/catalog-enhancements.bundle.js
          test -s dist/client/site.css
          test -s dist/client/site.bundle.js
          test -s dist/client/calculator.bundle.js
          test -s dist/client/catalog-enhancements.bundle.js
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const files = ['dist/client/site.bundle.js','dist/client/calculator.bundle.js','dist/client/catalog-enhancements.bundle.js','dist/client/site.css'];
          for (const file of files) {
            const body = fs.readFileSync(file);
            console.log(`${file}: ${body.length} bytes; gzip ${zlib.gzipSync(body).length} bytes`);
          }
          const site = fs.readFileSync('dist/client/site.bundle.js','utf8');
          const calc = fs.readFileSync('dist/client/calculator.bundle.js','utf8');
          const enhancements = fs.readFileSync('dist/client/catalog-enhancements.bundle.js','utf8');
          const worker = fs.readFileSync('dist/server/index.js','utf8');
          if (site.includes('GATE_CALC_MODELS_READY') || site.includes('KUZDVOR_FORMULA_PRICE_SYNC_READY')) throw new Error('Calculator leaked into initial bundle');
          if (!site.includes('/calculator.bundle.js') || !site.includes('/catalog-enhancements.bundle.js')) throw new Error('Lazy loader URLs missing');
          if (!site.includes('KUZDVOR_SCHEDULE_CATALOG_DATA')) throw new Error('Catalog API deferral missing');
          if (!calc.includes('GATE_CALC_MODELS_READY') || !calc.includes('KUZDVOR_FORMULA_PRICE_SYNC_READY')) throw new Error('Calculator bundle incomplete');
          if (!enhancements.includes('KUZDVOR_COLOR_PHOTO_SITE_READY')) throw new Error('Catalog enhancement bundle incomplete');
          if (!worker.includes('renderPublicPageWithStandardPrices') || !worker.includes('gateExcelStandardPrices')) throw new Error('Server standard-price projection missing');
          NODE
