name: Finalize master Excel behavior

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-master-excel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Excel importer for 38 active models and first publication
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin-excel-import.js')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ("const calcSheets = (workbook.SheetNames || []).filter(name => /\\(р\\)/iu.test(name));\n    if (calcSheets.length < 35) throw new Error(`В файле найдено только ${calcSheets.length} расчётных листов Арт(р). Ожидался полный файл ворот.`);",
             "const calcSheets = (workbook.SheetNames || []).filter(name => /\\(р\\)/iu.test(name)).filter(name => !/арт\\s*(?:39|40)\\s*\\(р\\)/iu.test(name));\n    if (calcSheets.length !== 38) throw new Error(`В файле найдено ${calcSheets.length} рабочих расчётных листов Арт(р). Ожидалось 38 используемых моделей.`);"),
            ("if (checked.length < 35) throw new Error('Excel не содержит сохранённых итоговых значений для проверки. Откройте файл в Excel, пересчитайте и сохраните его, затем загрузите снова.');",
             "if (checked.length < 38) throw new Error('Excel не содержит сохранённых итоговых значений для всех 38 используемых моделей. Откройте файл в Excel, пересчитайте и сохраните его, затем загрузите снова.');"),
            ("publishButton.disabled = Boolean(mismatches.length) || !materialChanges.length;",
             "publishButton.disabled = Boolean(mismatches.length) || (!materialChanges.length && Boolean(currentState?.fileAvailable));")
          ]
          for old,new in replacements:
            if old not in s:
              if new in s:
                continue
              raise SystemExit('Expected Excel importer block not found: '+old[:80])
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          t=Path('scripts/test-admin-integrity.mjs')
          ts=t.read_text(encoding='utf-8')
          needle="[excelAdmin, 'Публикация заблокирована', 'formula drift protection'],"
          add="[excelAdmin, 'Ожидалось 38 используемых моделей', '38-model Excel validation'],\n  [excelAdmin, 'Boolean(currentState?.fileAvailable)', 'first Excel publication without price changes'],"
          if add not in ts:
            if needle not in ts: raise SystemExit('Admin test anchor missing')
            ts=ts.replace(needle, needle+'\n  '+add,1)
            t.write_text(ts,encoding='utf-8')
      - name: Install and verify
        run: |
          npm install --include=dev --no-audit --no-fund
          npm install --no-save --include=dev xlsx@0.18.5 --no-audit --no-fund
          node --check admin-excel-import.js
          node scripts/test-admin-integrity.mjs
          node scripts/test-gate-calculator.mjs
          npm run build
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-excel-import.js scripts/test-admin-integrity.mjs
          if git diff --cached --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git commit -m 'Finalize 38-model Excel master flow'
          git push origin main
