name: Gate final audit fix

on:
  push:
    branches: [main]
    paths:
      - '.github/gate-final-audit-fix.py'
      - '.github/workflows/gate-final-audit-fix.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final audit fixes
        run: python3 .github/gate-final-audit-fix.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check gate-page-ui.js
          node --check public-site-settings.js
          node --check shared/customer-context.js
          node --check shared/delivery.js
          node --check shared/leads.js
      - name: Verify gate page foundation
        run: node scripts/test-gate-page.mjs
      - name: Verify Excel gate calculator
        run: node scripts/test-gate-calculator.mjs
      - name: Build production worker
        run: npm run build
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js gate-page-ui.js scripts/test-gate-page.mjs
          if git diff --cached --quiet; then
            echo "No final audit changes"
            exit 0
          fi
          git commit -m "Harden gate checkout after final UX audit"
          git push
