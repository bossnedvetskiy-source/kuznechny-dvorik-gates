name: Verify Excel gate calculator

on:
  push:
    paths:
      - '.github/workflows/test-gate-calculator.yml'
      - 'gate-calc-engine.js'
      - 'gate-calc-prices.js'
      - 'gate-calc-models.js'
      - 'gate-calc-models-chunk*.js'
      - 'scripts/test-gate-calculator.mjs'
      - 'app.js'
      - 'prices.js'
      - 'index.html'
      - 'scripts/build.mjs'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run calculator control tests
        run: node scripts/test-gate-calculator.mjs
      - name: Build production worker
        run: npm run build
