name: Verify gate page and calculator

on:
  push:
    paths:
      - '.github/workflows/test-gate-calculator.yml'
      - 'gate-calc-engine.js'
      - 'gate-calc-prices.js'
      - 'gate-calc-models.js'
      - 'gate-calc-models-chunk*.js'
      - 'scripts/test-gate-calculator.mjs'
      - 'scripts/test-gate-page.mjs'
      - 'app.js'
      - 'gate-page-ui.js'
      - 'gate-page.css'
      - 'public-site-settings.js'
      - 'shared/**'
      - 'prices.js'
      - 'index.html'
      - 'scripts/build.mjs'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check gate-page-ui.js
          node --check public-site-settings.js
          node --check shared/customer-context.js
          node --check shared/delivery.js
          node --check shared/leads.js
      - name: Verify simplified gate page foundation
        run: node scripts/test-gate-page.mjs
      - name: Run calculator control tests
        run: node scripts/test-gate-calculator.mjs
      - name: Build production worker
        run: npm run build
      - name: Check optimized public assets
        run: |
          node --check dist/server/index.js
          node --check dist/client/site.bundle.js
          test -s dist/client/site.css
          test -s dist/client/site.bundle.js
