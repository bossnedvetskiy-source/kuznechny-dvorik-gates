name: Verify gate page and calculator

on:
  push:
    paths:
      - '.github/workflows/test-gate-calculator.yml'
      - 'gate-calc-engine.js'
      - 'gate-calc-prices.js'
      - 'gate-calc-models.js'
      - 'gate-calc-models-chunk*.js'
      - 'runtime-price-adjustment.js'
      - 'scripts/test-gate-calculator.mjs'
      - 'scripts/test-gate-page.mjs'
      - 'scripts/test-server-gate-quote.mjs'
      - 'scripts/e2e-server.mjs'
      - 'tests/**'
      - 'app.js'
      - 'gate-page-ui.js'
      - 'gate-page.css'
      - 'public-site-settings.js'
      - 'color-photo-site.js'
      - 'admin*.js'
      - 'admin*.html'
      - 'admin*.css'
      - 'worker/**'
      - 'shared/**'
      - 'prices.js'
      - 'delivery-prices.json'
      - 'index.html'
      - 'scripts/build.mjs'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check gate-page-ui.js
          node --check public-site-settings.js
          node --check color-photo-site.js
          node --check runtime-price-adjustment.js
          node --check admin.js
          node --check admin-colors.js
          node --check admin-color-atomic.js
          node --check admin-prices.js
          node --check admin-site.js
          node --check admin-delivery.js
          node --check admin-leads.js
          node --check admin-workflow.js
          node --check admin-tabs-fix.js
          node --check admin-history.js
          node --check admin-guidance.js
          node --check worker/site-settings-d1.js
          node --check worker/gate-quote-d1.js
          node --check worker/admin-enhancements-d1.js
          node --check worker/admin-color-atomic-d1.js
          node --check worker/admin-media-cleanup-d1.js
          node --check shared/customer-context.js
          node --check shared/delivery.js
          node --check shared/leads.js
      - name: Verify simplified gate page foundation
        run: node scripts/test-gate-page.mjs
      - name: Run calculator control tests
        run: node scripts/test-gate-calculator.mjs
      - name: Verify authoritative server quote
        run: node scripts/test-server-gate-quote.mjs
      - name: Build production worker
        run: npm run build
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: npm run test:e2e
