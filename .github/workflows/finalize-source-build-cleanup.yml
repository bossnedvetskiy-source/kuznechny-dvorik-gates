name: Finalize source build cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply cleanup
        run: python3 .github/finalize-source-build-cleanup.py
      - name: Check JavaScript syntax
        run: |
          node --check admin.js
          node --check shared/leads.js
          node --check scripts/build.mjs
          node --check worker/runtime.js
          node --check worker/gate-quote-d1.js
          node --check worker/lead-antispam.js
          node --check worker/leads-d1.js
      - name: Verify foundation
        run: node scripts/test-gate-page.mjs
      - name: Verify gate calculator
        run: node scripts/test-gate-calculator.mjs
      - name: Verify authoritative server quote
        run: node scripts/test-server-gate-quote.mjs
      - name: Verify production build
        run: |
          npm run build
          node --check dist/server/index.js
      - name: Install browser tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: npm run test:e2e
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.js shared/leads.js scripts/build.mjs scripts/test-gate-page.mjs
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "Make admin source production-ready and simplify build"
          git push
