name: Apply site audit fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-site-audit-fix.yml'
      - '.github/site-audit-fix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audit fixes
        run: python3 .github/site-audit-fix.py
      - name: Run gate calculator tests
        run: node scripts/test-gate-calculator.mjs
      - name: Build production worker
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html storefront.css public-site-settings.js app.js worker/leads-d1.js admin-leads.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Improve conversion flow after full site audit"
          git push origin main
