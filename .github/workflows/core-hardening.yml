name: Core hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply hardening patch
        run: |
          python3 .github/core-hardening.py
          python3 .github/fix-core-hardening-test.py
          python3 .github/fix-core-build-models.py
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check gate-page-ui.js
          node --check shared/delivery.js
          node --check shared/leads.js
          node --check public-site-settings.js
          node --check worker/runtime.js
          node --check worker/gate-quote-d1.js
          node --check worker/lead-antispam.js
          node --check worker/leads-d1.js
          node --check scripts/build.mjs
      - name: Verify gate foundation
        run: node scripts/test-gate-page.mjs
      - name: Verify gate calculator
        run: node scripts/test-gate-calculator.mjs
      - name: Build production worker
        run: npm run build
      - name: Verify built worker syntax
        run: node --check dist/server/index.js
      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html gate-page.css app.js gate-page-ui.js shared/leads.js public-site-settings.js worker/runtime.js scripts/build.mjs scripts/test-gate-page.mjs
          if git diff --cached --quiet; then
            echo "No hardening changes"
            exit 0
          fi
          git commit -m "Harden gate quotes delivery and lead flow"
          git push
