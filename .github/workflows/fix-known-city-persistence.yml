name: One-off known city persistence fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-known-city-persistence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          marker="function updateDeliveryFromCity(){"
          pos=s.find(marker)
          if pos<0: raise SystemExit('updateDeliveryFromCity not found')
          tail=s[pos:]
          old="""    deliveryState={kind:'fixed',name:known.name,resolvedName:known.name,price:known.price};\n    routeButton.hidden=true;\n    setDeliveryResult(`${known.name} · населённый пункт выбран`,'success');"""
          new=old+"\n    rememberDeliverySelection();"
          if new not in tail:
            if old not in tail: raise SystemExit('known-city block not found')
            tail=tail.replace(old,new,1)
            s=s[:pos]+tail
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Persist selected known delivery city"
          git push origin main
