name: One-off desktop UX sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-ux-sync.yml'
      - '.github/desktop_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply desktop UX patch
        run: python3 .github/desktop_patch.py
      - name: Verify gate calculator
        run: node scripts/test-gate-calculator.mjs
      - name: Build production worker
        run: npm run build
      - name: Commit desktop UX changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html storefront.css public-site-settings.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync desktop UX with mobile ordering flow"
          git push origin main
