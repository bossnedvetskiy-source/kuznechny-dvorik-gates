name: Final hardening pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply final hardening
        run: python3 .github/final-hardening-pass.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check public-site-settings.js
          node --check shared/delivery.js
          node --check worker/gate-quote-d1.js
          node --check worker/lead-antispam.js
          node --check worker/leads-d1.js
          node --check scripts/build.mjs
      - name: Foundation tests
        run: node scripts/test-gate-page.mjs
      - name: Calculator tests
        run: node scripts/test-gate-calculator.mjs
      - name: Server quote tests
        run: node scripts/test-server-gate-quote.mjs
      - name: Production build
        run: npm run build
      - name: Built Worker syntax
        run: node --check dist/server/index.js
      - name: Commit verified code changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/delivery.js worker/gate-quote-d1.js public-site-settings.js app.js gate-page.css scripts/test-gate-page.mjs
          if git diff --cached --quiet; then
            echo "No hardening code changes"
            exit 0
          fi
          git commit -m "Finish gate hardening and delivery rules"
          git push
