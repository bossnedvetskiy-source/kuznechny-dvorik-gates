name: One-off posts persistence between designs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/persist-posts-between-designs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remember strengthened posts choice between gate designs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')

          key_anchor="const DELIVERY_MEMORY_KEY='kuzdvor:selected-delivery';\n"
          key_insert="const DELIVERY_MEMORY_KEY='kuzdvor:selected-delivery';\nconst POSTS_MEMORY_KEY='kuzdvor:strengthened-posts';\n"
          if "POSTS_MEMORY_KEY" not in s:
            if key_anchor not in s: raise SystemExit('memory key anchor not found')
            s=s.replace(key_anchor,key_insert,1)

          old_choose="""function chooseProduct(id){\n  productSelect.value=id;\n  const product=selectedProduct();\n  widthInput.value=product.standard[0];heightInput.value=product.standard[1];\n  wicketWidthInput.value=product.wicketWidth??1;\n  installCheck.checked=product.install>0;postsCheck.checked=false;\n  if(!cityInput.value.trim())restoreDeliverySelection();\n  updateControls();calculate();\n}"""
          new_choose="""function chooseProduct(id){\n  productSelect.value=id;\n  const product=selectedProduct();\n  widthInput.value=product.standard[0];heightInput.value=product.standard[1];\n  wicketWidthInput.value=product.wicketWidth??1;\n  installCheck.checked=product.install>0;\n  if(product.type==='catalog'&&product.posts){\n    try{postsCheck.checked=sessionStorage.getItem(POSTS_MEMORY_KEY)==='1'}catch{postsCheck.checked=false}\n  }else{\n    postsCheck.checked=false;\n  }\n  if(!cityInput.value.trim())restoreDeliverySelection();\n  updateControls();calculate();\n}"""
          if old_choose in s:
            s=s.replace(old_choose,new_choose,1)
          elif new_choose not in s:
            raise SystemExit('chooseProduct anchor not found')

          listener_anchor="""cityInput.addEventListener('input',updateDeliveryFromCity);\ncityInput.addEventListener('change',updateDeliveryFromCity);\nif(restoreDeliverySelection())calculate();\n"""
          listener_new="""cityInput.addEventListener('input',updateDeliveryFromCity);\ncityInput.addEventListener('change',updateDeliveryFromCity);\npostsCheck.addEventListener('change',()=>{\n  const product=selectedProduct();\n  if(product?.type!=='catalog')return;\n  try{sessionStorage.setItem(POSTS_MEMORY_KEY,postsCheck.checked?'1':'0')}catch{}\n});\nif(restoreDeliverySelection())calculate();\n"""
          if "sessionStorage.setItem(POSTS_MEMORY_KEY" not in s:
            if listener_anchor not in s: raise SystemExit('listener anchor not found')
            s=s.replace(listener_anchor,listener_new,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Remember strengthened posts between gate designs"
          git push origin main
