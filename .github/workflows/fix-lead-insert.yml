name: Fix lead insert

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply fix
        run: python3 .github/fix-lead-insert.py
      - name: Verify page foundation
        run: node scripts/test-gate-page.mjs
      - name: Verify gate calculator
        run: node scripts/test-gate-calculator.mjs
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/leads-d1.js scripts/test-gate-page.mjs
          git commit -m "Fix lead consent insert binding"
          git push
