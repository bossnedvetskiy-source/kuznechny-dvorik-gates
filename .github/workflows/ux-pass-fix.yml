name: One-off full mobile UX pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ux-pass-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply client-first UX improvements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Let the success flow close the mobile lead sheet cleanly.
          anchor = """      const calculatorObserver = new MutationObserver(()=>{\n"""
          if "document.addEventListener('lead-sent',closeSheet);" not in text:
              if anchor not in text:
                  raise SystemExit('calculator observer anchor not found')
              text = text.replace(anchor, """      document.addEventListener('lead-sent',closeSheet);\n\n""" + anchor, 1)

          marker = 'data-client-ux-pass="2026-09-08"'
          if marker not in text:
              enhancement = r'''
  <style data-client-ux-pass="2026-09-08">
    .hero-standard-note{margin:10px 0 0;color:rgba(255,255,255,.58);font-size:13px;line-height:1.45}
    .success-order-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(3px);z-index:520}
    .success-order-modal{position:fixed;z-index:530;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 28px));background:#f4f1e9;color:#181818;border-radius:22px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.48)}
    .success-order-modal[hidden],.success-order-backdrop[hidden]{display:none!important}
    .success-order-modal h2{font:30px/1.15 Prata,serif;margin:0 0 10px}
    .success-order-modal p{margin:0 0 18px;color:#676158;line-height:1.55}
    .success-order-actions{display:grid;gap:10px}
    .success-order-actions button,.success-order-actions a{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:13px;text-decoration:none;font-weight:800;font-size:14px}
    .success-order-done{border:0;background:#d5a13b;color:#17130b}
    .success-order-wa{border:1px solid rgba(17,18,20,.16);background:#fff;color:#171717}

    @media(max-width:620px){
      .filter-tabs{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;overflow:visible!important;width:100%!important}
      .filter-tabs .filter{width:100%!important;min-width:0!important;justify-content:center!important;text-align:center!important;padding-left:8px!important;padding-right:8px!important}
      .catalog-tools{width:100%!important}
      .catalog-tools .search-label{display:none!important}
      .catalog-tools .sort-label{width:100%!important}
      .catalog-tools .sort-label select{width:100%!important}
      .hero-standard-note{font-size:12px!important;margin-top:9px!important;color:rgba(255,255,255,.66)!important}
      .selected-product-preview{position:relative!important;padding-bottom:48px!important}
      .change-product-mobile{position:absolute!important;left:12px!important;right:12px!important;bottom:8px!important;min-height:34px!important;border:0!important;background:transparent!important;color:var(--gold-light)!important;text-align:left!important;font-size:13px!important;font-weight:800!important;padding:0!important}
      .base-install-note{font-size:12px!important;line-height:1.45!important;color:rgba(255,255,255,.66)!important}
      .simplified-posts-block .compact-post-switch{min-height:44px!important;padding:8px 10px!important}
      .simplified-posts-block .compact-post-switch b{font-size:13px!important}
      .simplified-posts-block .compact-post-switch>strong{font-size:12px!important}
      .color-label,.city-label{font-size:13px!important}
      .delivery-result,.delivery-help summary,.delivery-help p{font-size:12px!important;line-height:1.45!important}
      .mobile-price-breakdown>summary span{font-size:13px!important}
      .mobile-price-breakdown>summary small{font-size:12px!important}
      .mobile-price-lines .estimate-line,.mobile-price-lines .estimate-line strong{font-size:12px!important}
      .mobile-price-note{font-size:12px!important;line-height:1.5!important}
      #leadRequest .mobile-lead-heading p{font-size:13px!important}
      #leadRequest .lead-fields label{font-size:13px!important}
      #leadRequest .consent-row{font-size:12px!important;line-height:1.45!important}
      .mobile-delivery-summary{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;align-items:center!important;gap:4px 10px!important;padding:12px 13px!important;border:1px solid rgba(255,255,255,.11)!important;border-radius:12px!important;background:#0d0e10!important}
      .mobile-delivery-summary span{font-size:11px!important;color:rgba(255,255,255,.5)!important}
      .mobile-delivery-summary strong{grid-column:1!important;font-size:14px!important;color:#fff!important}
      .mobile-delivery-summary button{grid-column:2!important;grid-row:1/3!important;border:1px solid rgba(230,189,105,.48)!important;border-radius:9px!important;background:transparent!important;color:var(--gold-light)!important;min-height:36px!important;padding:0 12px!important;font-size:12px!important;font-weight:800!important}
      .mobile-delivery-wrap:not(.is-editing) .city-label,.mobile-delivery-wrap:not(.is-editing) .delivery-result,.mobile-delivery-wrap:not(.is-editing) .route-button,.mobile-delivery-wrap:not(.is-editing) .delivery-help{display:none!important}
      .mobile-delivery-wrap.is-editing .mobile-delivery-summary{margin-bottom:10px!important}
      .success-order-modal{padding:20px 18px!important;border-radius:18px!important}
      .success-order-modal h2{font-size:26px!important}
    }
  </style>
  <script data-client-ux-pass="2026-09-08">
    (()=>{
      const calculator=document.getElementById('calculator');
      const catalog=document.getElementById('catalog');
      const mobileCta=document.getElementById('mobilePrimaryCta');
      const mobileTotal=document.getElementById('mobileEstimateTotal');
      const postsCheck=document.getElementById('postsCheck');
      const postsTitle=document.getElementById('postsTitle');
      const productSelect=document.getElementById('productSelect');
      const cityInput=document.getElementById('cityInput');
      const deliveryResult=document.getElementById('deliveryResult');
      const sendButton=document.getElementById('sendButton');
      const phoneInput=document.getElementById('phoneInput');
      const consentInput=document.getElementById('consentInput');

      // Make the starting prices unambiguous.
      const heroPrices=document.querySelector('.hero-prices');
      if(heroPrices&&!document.querySelector('.hero-standard-note')){
        const note=document.createElement('p');
        note.className='hero-standard-note';
        note.textContent='Цена указана для стандартного размера: ворота 3,4 × 1,8 м и калитка 1 × 1,8 м. Другой размер рассчитаем после замера.';
        heroPrices.after(note);
      }

      // Keep the package copy consistent with the new calculator logic.
      const packageNote=document.querySelector('.package-note');
      if(packageNote) packageNote.textContent='В базовую цену входит установка ворот с калиткой на готовые столбы. Новые усиленные столбы и доставка рассчитываются отдельно.';

      // Only two useful sort choices for a novice user.
      const sortSelect=document.getElementById('sortSelect');
      const recommended=sortSelect?.querySelector('option[value="recommended"]');
      recommended?.remove();
      if(sortSelect&&sortSelect.value==='') sortSelect.value='price-asc';
      if(sortSelect&&sortSelect.value==='recommended'){
        sortSelect.value='price-asc';
        sortSelect.dispatchEvent(new Event('change',{bubbles:true}));
      }

      // A clear way to go back from the calculator to the catalogue.
      const preview=document.querySelector('.selected-product-preview');
      if(preview&&!preview.querySelector('.change-product-mobile')){
        const back=document.createElement('button');
        back.type='button';
        back.className='change-product-mobile';
        back.textContent='← Выбрать другие ворота';
        back.addEventListener('click',()=>{
          try{ if(typeof closeInlineCalculator==='function') closeInlineCalculator(); else calculator.hidden=true; }catch{ calculator.hidden=true; }
          document.body.classList.remove('calculator-open','mobile-lead-open','lead-keyboard-open');
          catalog?.scrollIntoView({behavior:'smooth',block:'start'});
        });
        preview.append(back);
      }

      // Make the posts option read like an action/result rather than a technical control.
      const syncPosts=()=>{
        if(!postsTitle||!postsCheck)return;
        const next=postsCheck.checked?'✓ Новые усиленные столбы добавлены':'Добавить новые усиленные столбы';
        if(postsTitle.textContent!==next) postsTitle.textContent=next;
      };
      postsCheck?.addEventListener('change',syncPosts);
      productSelect?.addEventListener('change',()=>setTimeout(syncPosts,0));
      if(postsTitle) new MutationObserver(syncPosts).observe(postsTitle,{childList:true,subtree:true,characterData:true});
      syncPosts();

      // Turn delivery into a simple summary with an explicit "Изменить" action.
      const deliveryBlock=cityInput?.closest('.form-block');
      if(deliveryBlock&&!deliveryBlock.classList.contains('mobile-delivery-wrap')){
        deliveryBlock.classList.add('mobile-delivery-wrap');
        const summary=document.createElement('div');
        summary.className='mobile-delivery-summary';
        summary.innerHTML='<span>Доставка</span><strong></strong><button type="button">Изменить</button>';
        const step=deliveryBlock.querySelector('.step-label');
        step?.after(summary);
        const summaryValue=summary.querySelector('strong');
        const syncDeliverySummary=()=>{
          const city=(cityInput?.value||'').trim();
          const result=(deliveryResult?.textContent||'').toLowerCase();
          if(!city) summaryValue.textContent='Укажите населённый пункт';
          else if(city.toLowerCase().replace('ё','е')==='мелеуз') summaryValue.textContent='Мелеуз — бесплатно';
          else if(result.includes('бесплат')) summaryValue.textContent=`${city} — бесплатно`;
          else if(result.includes('выбран')||result.includes('подтвержд')) summaryValue.textContent=`${city} — доставка учтена в итоге`;
          else summaryValue.textContent=city;
        };
        summary.querySelector('button').addEventListener('click',()=>{
          deliveryBlock.classList.add('is-editing');
          setTimeout(()=>cityInput?.focus(),80);
        });
        cityInput?.addEventListener('input',syncDeliverySummary);
        cityInput?.addEventListener('change',syncDeliverySummary);
        if(deliveryResult) new MutationObserver(syncDeliverySummary).observe(deliveryResult,{childList:true,subtree:true,characterData:true});
        syncDeliverySummary();
      }

      // Short, readable consent copy while keeping the policy link.
      const consentRow=document.querySelector('#leadRequest .consent-row span');
      const privacyLink=consentRow?.querySelector('a[href="#privacyPolicy"]');
      if(consentRow&&privacyLink){
        consentRow.replaceChildren(document.createTextNode('Согласен на обработку данных · '),privacyLink);
        privacyLink.textContent='Политика';
      }

      // Before a model is chosen the bottom action only takes the client to the catalogue.
      const syncFriendlyCta=()=>{
        if(!mobileCta)return;
        const price=(mobileTotal?.textContent||'').trim();
        if(calculator?.hidden) mobileCta.textContent='Выбрать ворота';
        else if(document.body.classList.contains('mobile-lead-open')) mobileCta.textContent=`Отправить заявку · ${price}`;
        else mobileCta.textContent=`Заказать бесплатный замер · ${price}`;
      };
      mobileCta?.addEventListener('click',event=>{
        if(!calculator?.hidden)return;
        event.preventDefault();
        event.stopImmediatePropagation();
        catalog?.scrollIntoView({behavior:'smooth',block:'start'});
      },true);
      if(mobileTotal) new MutationObserver(syncFriendlyCta).observe(mobileTotal,{childList:true,subtree:true,characterData:true});
      new MutationObserver(syncFriendlyCta).observe(document.body,{attributes:true,attributeFilter:['class']});
      syncFriendlyCta();

      // Friendly success state: the application is saved first; WhatsApp is optional afterwards.
      const successBackdrop=document.createElement('div');
      successBackdrop.className='success-order-backdrop';
      successBackdrop.hidden=true;
      const successModal=document.createElement('section');
      successModal.className='success-order-modal';
      successModal.hidden=true;
      successModal.setAttribute('role','dialog');
      successModal.setAttribute('aria-modal','true');
      successModal.innerHTML=`<h2>Заявка получена</h2><p>Спасибо. Мы свяжемся с вами для согласования бесплатного замера и окончательной стоимости.</p><div class="success-order-actions"><a class="success-order-wa" href="#">Написать нам в WhatsApp</a><button class="success-order-done" type="button">Готово</button></div>`;
      document.body.append(successBackdrop,successModal);
      const waButton=successModal.querySelector('.success-order-wa');
      const doneButton=successModal.querySelector('.success-order-done');
      const closeSuccess=()=>{
        successBackdrop.hidden=true;
        successModal.hidden=true;
        document.body.classList.remove('success-order-open');
      };
      successBackdrop.addEventListener('click',closeSuccess);
      doneButton.addEventListener('click',()=>{
        closeSuccess();
        catalog?.scrollIntoView({behavior:'smooth',block:'start'});
      });

      sendButton?.addEventListener('click',async event=>{
        event.preventDefault();
        event.stopImmediatePropagation();
        const phoneDigits=(phoneInput?.value||'').replace(/\D/g,'');
        if(phoneDigits.length<10||phoneDigits.length>11){
          phoneInput?.setAttribute('aria-invalid','true');
          phoneInput?.focus();
          if(typeof showToast==='function') showToast('Укажите номер телефона');
          return;
        }
        if(!cityInput?.value.trim()){
          cityInput?.focus();
          if(typeof showToast==='function') showToast('Укажите населённый пункт');
          return;
        }
        if(consentInput&&!consentInput.checked){
          consentInput.setAttribute('aria-invalid','true');
          consentInput.focus();
          if(typeof showToast==='function') showToast('Подтвердите согласие на обработку данных');
          return;
        }
        let payload;
        try{ payload=typeof leadPayload==='function'?leadPayload():null; }catch{}
        if(!payload){
          if(typeof showToast==='function') showToast('Не удалось подготовить заявку');
          return;
        }
        sendButton.disabled=true;
        try{
          const response=await fetch('/api/leads',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload),keepalive:true});
          if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.error||'Не удалось отправить заявку')}
          if(window.ym) ym(107269914,'reachGoal','lead_saved',{article:payload.article,city:payload.city});
          const whatsappDigits=String((window.SITE_SETTINGS||{}).whatsappDigits||'79373296750');
          waButton.href=`https://wa.me/${whatsappDigits}?text=${encodeURIComponent(payload.message||'Здравствуйте! Хочу уточнить заказ.')}`;
          document.dispatchEvent(new CustomEvent('lead-sent'));
          successBackdrop.hidden=false;
          successModal.hidden=false;
          document.body.classList.add('success-order-open');
          syncFriendlyCta();
        }catch(error){
          if(typeof showToast==='function') showToast(error?.message||'Не удалось отправить заявку');
        }finally{
          sendButton.disabled=false;
        }
      },true);
    })();
  </script>
'''
              text = text.replace('</body>', enhancement + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit UX pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify mobile customer journey and order flow"
          git push origin main
