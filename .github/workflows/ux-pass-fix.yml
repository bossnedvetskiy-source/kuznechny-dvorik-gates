name: One-off full mobile UX pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ux-pass-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply UX patch
        run: python3 scripts/ux-pass.py
      - name: Commit UX changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify mobile customer journey and order flow"
          git push origin main
