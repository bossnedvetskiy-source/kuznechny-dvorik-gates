name: Fix calculator lifecycle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply lifecycle fix
        run: python3 .github/fix-calculator-parking.py
      - name: Verify syntax and foundation
        run: |
          node --check app.js
          node scripts/test-gate-page.mjs
          node scripts/test-gate-calculator.mjs
          npm run build
          node --check dist/server/index.js
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js scripts/test-gate-page.mjs
          if git diff --cached --quiet; then
            echo "No lifecycle changes"
            exit 0
          fi
          git commit -m "Keep gate calculator mounted while switching designs"
          git push
