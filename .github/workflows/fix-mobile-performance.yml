name: Fix mobile performance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Reduce mobile catalog work
        shell: python
        run: |
          from pathlib import Path
          import re

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')

          # The decorative blurred backdrop duplicates every catalog photo request on mobile.
          app, removed = re.subn(
              r'\s*<img class="product-image-backdrop" src="\$\{product\.image\}" alt="" aria-hidden="true" loading="lazy">',
              '', app, count=1
          )
          if not removed and 'class="product-image-backdrop"' in app:
              raise SystemExit('Could not remove duplicate product backdrop image')

          app = app.replace(
              'loading="lazy">\n      </button>',
              'loading="lazy" decoding="async" fetchpriority="low">\n      </button>',
              1
          )

          shared_loader = """function loadCatalogImagesData() {
            if (!window.KUZDVOR_CATALOG_IMAGES_PROMISE) {
              window.KUZDVOR_CATALOG_IMAGES_PROMISE = fetch('/api/catalog-images',{cache:'no-store'})
                .then(response => response.ok ? response.json() : null)
                .catch(() => null);
            }
            return window.KUZDVOR_CATALOG_IMAGES_PROMISE;
          }

          async function loadPublishedGalleries() {
            try {
              const data=await loadCatalogImagesData();
              if(!data)return;
              let visibleChanged=false;
              for(const product of catalogProducts){
                const published=data.galleries?.[product.art];
                if(!published||!Array.isArray(published.photos)||!published.photos.length)continue;
                const photos=published.photos.filter(url=>typeof url==='string'&&url.startsWith('/'));
                if(!photos.length)continue;
                const nextMedia=published.mediaType==='sketch'?'sketch':'photo';
                const changed=product.media!==nextMedia || product.gallery.length!==photos.length || product.gallery.some((url,index)=>url!==photos[index]);
                if(!changed)continue;
                if(product.rank<=visibleCount)visibleChanged=true;
                product.gallery=photos;
                product.image=photos[0];
                product.media=nextMedia;
              }
              if(visibleChanged)renderProducts();
              updateSelectedPreview();
            } catch {}
          }"""
          if 'function loadCatalogImagesData()' not in app:
              pattern = r"async function loadPublishedGalleries\(\) \{[\s\S]*?\n\}\n\n(?=function rememberedDimensions\(\))"
              app, count = re.subn(pattern, shared_loader + '\n\n', app, count=1)
              if count != 1:
                  raise SystemExit('Could not replace catalog gallery loader')
          app_path.write_text(app, encoding='utf-8')

          colors_path = Path('color-photo-site.js')
          colors = colors_path.read_text(encoding='utf-8')
          if 'KUZDVOR_CATALOG_IMAGES_PROMISE ||' not in colors:
              pattern = r"const response = await fetch\('/api/catalog-images', \{cache:'no-store'\}\);\s*if \(!response\.ok\) throw new Error\('catalog'\);\s*const data = await response\.json\(\);"
              replacement = """const request = window.KUZDVOR_CATALOG_IMAGES_PROMISE || (window.KUZDVOR_CATALOG_IMAGES_PROMISE = fetch('/api/catalog-images', {cache:'no-store'})
                    .then(response => response.ok ? response.json() : null)
                    .catch(() => null));
                  const data = await request;
                  if (!data) throw new Error('catalog');"""
              colors, count = re.subn(pattern, replacement, colors, count=1)
              if count != 1:
                  raise SystemExit('Could not share catalog image request with color module')
          colors_path.write_text(colors, encoding='utf-8')

          styles_path = Path('styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          if 'Mobile catalog performance guard' not in styles:
              styles += """

          /* Mobile catalog performance guard: cards keep natural height and never stretch into blank rows. */
          @media(max-width:620px){
            .catalog-grid{align-items:start!important;grid-auto-rows:max-content!important}
            .product-card{height:auto!important;min-height:0!important;align-self:start!important}
            .product-card .product-info{flex:0 0 auto!important;min-height:0!important}
            .product-image-backdrop{display:none!important}
          }
          """
          styles_path.write_text(styles, encoding='utf-8')

          test_path = Path('scripts/test-gate-page.mjs')
          tests = test_path.read_text(encoding='utf-8')
          if 'duplicate decorative backdrop images' not in tests:
              anchor = "console.log('Gate page foundation checks: OK');"
              guard = """const colorPhotoSite = await readFile('color-photo-site.js','utf8');
          const stylesCss = await readFile('styles.css','utf8');
          assert(!app.includes('class=\\\"product-image-backdrop\\\"'), 'Catalog cards must not request duplicate decorative backdrop images');
          assert(app.includes('KUZDVOR_CATALOG_IMAGES_PROMISE'), 'Catalog image API must be shared instead of fetched independently');
          assert(colorPhotoSite.includes('KUZDVOR_CATALOG_IMAGES_PROMISE'), 'Color photos must reuse the shared catalog image request');
          assert(stylesCss.includes('Mobile catalog performance guard') && stylesCss.includes('grid-auto-rows:max-content'), 'Mobile card stretch guard missing');
          """
              if anchor not in tests:
                  raise SystemExit('Gate page test anchor missing')
              tests = tests.replace(anchor, guard + '\n' + anchor, 1)
              test_path.write_text(tests, encoding='utf-8')

      - name: Verify patch
        run: |
          node --check app.js
          node --check color-photo-site.js
          node scripts/test-gate-page.mjs

      - name: Commit performance fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js color-photo-site.js styles.css scripts/test-gate-page.mjs
          if git diff --cached --quiet; then
            echo 'Performance patch already applied.'
            exit 0
          fi
          git commit -m 'Speed up mobile catalog and prevent card stretching'
          git push origin main
