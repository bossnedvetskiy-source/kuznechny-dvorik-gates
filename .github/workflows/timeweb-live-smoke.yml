name: Check Timeweb DNS

on:
  push:
    branches: [timeweb-migration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-dns-check
  cancel-in-progress: true

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Timeweb test domain
        shell: bash
        run: |
          set -euo pipefail
          echo 'IPv4:'
          getent ahostsv4 kuzdvor.tw1.ru | head
          echo 'IPv6:'
          getent ahostsv6 kuzdvor.tw1.ru | head || true

      - name: Optional GitHub-runner HTTPS probe
        shell: bash
        run: |
          set +e
          curl --fail --show-error --silent --location --max-time 8 \
            --output /dev/null https://kuzdvor.tw1.ru/
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::Timeweb is not reachable from this GitHub-hosted runner. This host/network path is known to time out; authoritative health checks run from Timeweb itself after deployment."
          else
            echo 'GitHub runner can reach the Timeweb test site.'
          fi
          exit 0
