name: Browser customer journey

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'public-site-settings.js'
      - 'gate-page-ui.js'
      - 'gate-page.css'
      - 'styles.css'
      - 'storefront.css'
      - 'shared/**'
      - 'gate-calc-*.js'
      - 'prices.js'
      - 'delivery-prices.json'
      - 'tests/**'
      - 'playwright.config.js'
      - 'scripts/e2e-server.mjs'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run customer journey tests
        run: npx playwright test
