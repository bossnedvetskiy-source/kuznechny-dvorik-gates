name: Browser customer journey

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'public-site-settings.js'
      - 'public-lazy-runtime.js'
      - 'gate-page-ui.js'
      - 'gate-formula-prices-site.js'
      - 'gate-page.css'
      - 'styles.css'
      - 'storefront.css'
      - 'shared/**'
      - 'gate-calc-*.js'
      - 'prices.js'
      - 'delivery-prices.json'
      - 'tests/**'
      - 'playwright.config.js'
      - 'scripts/e2e-server.mjs'
      - 'scripts/verify-delivery-browser.mjs'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run customer journey tests
        run: npx playwright test
      - name: Build exact Timeweb browser package
        run: |
          set -euo pipefail
          if [ ! -s node_modules/xlsx/dist/xlsx.full.min.js ]; then
            test -s node_modules/xlsx/xlsx.js
            mkdir -p node_modules/xlsx/dist
            cp node_modules/xlsx/xlsx.js node_modules/xlsx/dist/xlsx.full.min.js
          fi
          npm run build
          node scripts/build-timeweb.mjs
          test -s timeweb-dist/index.html
          test -s timeweb-dist/site.bundle.js
          grep -Fq 'С учётом доставки' timeweb-dist/site.bundle.js
      - name: Verify delivery prices in exact Timeweb bundle
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 --directory timeweb-dist >/tmp/kuzdvor-timeweb-e2e.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep .25
          done
          TARGET_URL='http://127.0.0.1:4174' DELIVERY_CITY='Салават' EXPECTED_DELIVERY='4500' node scripts/verify-delivery-browser.mjs
      - name: Probe Timeweb reachability
        id: timeweb
        run: |
          set -euo pipefail
          reachable=false
          for attempt in $(seq 1 4); do
            code="$(curl -sS --connect-timeout 2 --max-time 4 -o /dev/null -w '%{http_code}' "https://kuzdvor.tw1.ru/deployment-version.json?probe=${attempt}&sha=${GITHUB_SHA}" 2>/dev/null || true)"
            echo "Probe ${attempt}/4: HTTP ${code:-000}"
            if [ "$code" = '200' ]; then reachable=true; break; fi
            sleep 3
          done
          echo "reachable=$reachable" >> "$GITHUB_OUTPUT"
          if [ "$reachable" != 'true' ]; then
            echo '::warning::Timeweb is unreachable from this GitHub-hosted runner. Exact production bundle browser test passed locally; live browser verification is skipped for this runner.'
          fi
      - name: Wait for this commit on Timeweb
        if: steps.timeweb.outputs.reachable == 'true'
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          echo "Waiting for Timeweb to serve $expected"
          for attempt in $(seq 1 36); do
            body="$(curl -fsS --connect-timeout 3 --max-time 6 "https://kuzdvor.tw1.ru/deployment-version.json?live_test=${attempt}&expected=${expected}" 2>/dev/null || true)"
            live="$(BODY="$body" node -e "try{process.stdout.write(JSON.parse(process.env.BODY||'{}').sourceSha||'')}catch{}")"
            echo "Attempt ${attempt}/36: ${live:-unavailable}"
            if [ "$live" = "$expected" ]; then
              echo "Current commit is live on Timeweb."
              exit 0
            fi
            sleep 10
          done
          echo "Timeweb did not publish $expected within the test window." >&2
          exit 1
      - name: Verify delivery prices on live Timeweb
        if: steps.timeweb.outputs.reachable == 'true'
        env:
          TARGET_URL: https://kuzdvor.tw1.ru
          DELIVERY_CITY: Салават
          EXPECTED_DELIVERY: '4500'
        run: node scripts/verify-delivery-browser.mjs
