name: Surveyor V3 isolated checks

on:
  push:
    branches:
      - feature/kd-surveyor-v3-redesign
      - feature/kd-surveyor-v3-fence-cards
      - feature/kd-surveyor-v3-canopy-ux
      - fix/surveyor-gates-no-measure-cta
      - fix/surveyor-dedicated-gates-route
      - fix/surveyor-fresh-v4-and-legacy-gate-redirect
      - fix/surveyor-canopy-tile-media
      - fix/surveyor-optional-contact-and-address
      - fix/fence-reset-per-survey-draft
      - feature/surveyor-unified-estimate-v1
      - feature/surveyor-plan-from-estimate-v1
      - feature/surveyor-visual-post-controls
      - feature/kd-surveyor-offline-first-android
      - feature/sliding-gates-surveyor-dev-20261015
      - feature/sliding-frame-card-schematics-20261015
      - fix/sliding-jalousie-empty-frame-centerpost-20261015
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surveyor-v3-isolated
  cancel-in-progress: true

jobs:
  surveyor-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Check source and integrity
        run: |
          node --check surveyor-app/app.js
          node --check surveyor-app/sw.js
          node --check surveyor-app/offline-readiness.js
          node --check scripts/build-dev-preview.mjs
          node --check scripts/test-surveyor-integrity.mjs
          node scripts/test-surveyor-integrity.mjs
      - name: Prepare DEV preview and calculator assets
        run: |
          if [ ! -s node_modules/xlsx/dist/xlsx.full.min.js ]; then
            mkdir -p node_modules/xlsx/dist
            cp node_modules/xlsx/xlsx.js node_modules/xlsx/dist/xlsx.full.min.js
          fi
          npm run build
          node scripts/build-timeweb.mjs
          node scripts/build-dev-preview.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify calculated dimensions flow into the scheme without double counting
        if: github.ref != 'refs/heads/feature/kd-surveyor-offline-first-android' && github.ref != 'refs/heads/feature/sliding-gates-surveyor-dev-20261015' && github.ref != 'refs/heads/feature/sliding-frame-card-schematics-20261015' && github.ref != 'refs/heads/fix/sliding-jalousie-empty-frame-centerpost-20261015'
        run: npx playwright test tests/surveyor-plan-from-estimate.spec.js tests/surveyor-mobile.spec.js --workers=1
      - name: Verify offline controls and real cross-calculator navigation
        if: github.ref == 'refs/heads/feature/kd-surveyor-offline-first-android'
        run: npx playwright test tests/dev-pwa.spec.js tests/surveyor-offline-readiness.spec.js --workers=1
      - name: Verify sliding-gates survey quote integration
        if: github.ref == 'refs/heads/feature/sliding-gates-surveyor-dev-20261015' || github.ref == 'refs/heads/feature/sliding-frame-card-schematics-20261015' || github.ref == 'refs/heads/fix/sliding-jalousie-empty-frame-centerpost-20261015'
        run: npx playwright test tests/surveyor-sliding-gates.spec.js --workers=1
