plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.kuzdvor.surveyor'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.kuzdvor.surveyor'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.3.0'
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../surveyor-app']
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
