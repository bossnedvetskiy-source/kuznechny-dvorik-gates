<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Обновление приложения — Кузнечный Дворик</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#0c0d0f;color:#f7f2e8;font-family:Arial,Helvetica,sans-serif}
    main{width:min(100%,520px);padding:28px;border:1px solid rgba(230,189,105,.28);border-radius:22px;background:#151619;box-shadow:0 18px 42px rgba(0,0,0,.28)}
    h1{margin:0 0 12px;font:30px/1.08 Georgia,serif}
    p{margin:0;color:#aaa39a;font-size:14px;line-height:1.55}
    .status{margin-top:18px;padding:14px 16px;border-radius:14px;background:#1b1d20;color:#f0c96f;font-weight:800}
    button{width:100%;min-height:50px;margin-top:16px;border:1px solid rgba(211,160,68,.45);border-radius:14px;background:#1b1c20;color:#f5e3bb;font-weight:900;font-size:15px}
  </style>
</head>
<body>
<main>
  <h1>Обновляем приложение</h1>
  <p>Эта страница удаляет только старую оболочку и её офлайн-кэш. Заявки и данные сайта на сервере не затрагиваются.</p>
  <div class="status" id="status">Подготавливаем обновление…</div>
  <button id="retry" type="button" hidden>Повторить обновление</button>
</main>
<script>
(() => {
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');
  const set=text=>status.textContent=text;

  async function resetOldApp(){
    retry.hidden=true;
    try{
      set('Удаляем старую версию приложения…');
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.allSettled(regs.map(reg=>reg.unregister()));
      }

      set('Очищаем старый офлайн-кэш…');
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.allSettled(keys.filter(key=>
          key.startsWith('kuzdvor-offline-') ||
          key.startsWith('kuzdvor-site-')
        ).map(key=>caches.delete(key)));
      }

      set('Готово. Открываем новую версию…');
      const url='/app?force-update=2026-09-23-v10&t='+Date.now();
      setTimeout(()=>location.replace(url),500);
    }catch(error){
      set('Не удалось завершить обновление. Нажмите «Повторить обновление».');
      retry.hidden=false;
    }
  }

  retry.addEventListener('click',resetOldApp);
  resetOldApp();
})();
</script>
</body>
</html>
